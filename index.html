<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EFE9E2">
<title>fotn</title>
<meta name="description" content="fotn — presets photo inspirés des pellicules argentiques classiques, à appliquer et régler sur vos photos.">
<link rel="icon" type="image/svg+xml" href="favicon.svg?v=14">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png?v=14">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=14">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="fotn">
<link rel="preload" href="fonts/GoogleSansFlex-latin.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* Google Sans Flex (variable, self-hosted) */
@font-face{font-family:"Google Sans Flex";font-style:normal;font-weight:100 1000;font-display:swap;src:url(fonts/GoogleSansFlex-latin-ext.woff2) format("woff2");unicode-range:U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF}
@font-face{font-family:"Google Sans Flex";font-style:normal;font-weight:100 1000;font-display:swap;src:url(fonts/GoogleSansFlex-latin.woff2) format("woff2");unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD}
:root{
  /* Monochrome LIGHT — cream / black / grey (colour lives only in the photos) */
  --bg:#EFE9E2; --bg2:#f7f7f7; --panel:#f0f0f0; --panel2:#e8e8e8;
  --line:#e4e4e4; --line2:#d2d2d2;
  --txt:#292929; --txt2:#595959; --txt3:#8c8c8c;
  --accent:#292929; --accent2:#2c2c2c;   /* "accent" = the darkest neutral, for active/primary */
  --pos:#141414; --neg:#9a9a9a;
  --ink:#EFE9E2;            /* text/icon colour on the dark accent */
  --div:2px;                /* editor divider thickness */
  /* radius scale */
  --r-lg:0;             /* cards, sheets */
  --r-md:0;             /* inputs, buttons, panels, controls */
  --r-sm:0;              /* badges, inner segments, small marks */
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  background:var(--bg); color:var(--txt);
  font-family:"Google Sans Flex","Helvetica Neue",Helvetica,Arial,sans-serif;
  font-size:15px; line-height:1.45; -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
button{font-family:inherit;color:inherit;cursor:pointer;border:none;background:none}
input{font-family:inherit}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:0}
::-webkit-scrollbar-track{background:transparent}

/* ---------- HEADER ---------- */
.app{position:relative;z-index:1;max-width:1320px;margin:0 auto;padding:0 16px}
header.top{
  padding:calc(var(--safe-t) + 14px) 0 10px;   /* top safe-area spacing; no background (let the backdrop show) */
}
.count{margin-left:auto;font-size:11px;color:var(--txt3);text-align:right;flex:none}
.count b{color:var(--accent);font-weight:700}

/* selection bar — 61px tall, no layout jump when it appears */
.selbar{min-height:61px;display:flex;align-items:center;gap:10px;animation:selbarIn .16s ease}
.selbar[hidden]{display:none}   /* class rule would otherwise beat the UA [hidden] */
@keyframes selbarIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.sbtn{flex:none;padding:8px 14px;border-radius:0;font-size:13px;font-weight:600;white-space:nowrap;
  background:var(--panel);border:1px solid var(--line);color:var(--txt);transition:.15s}
.sbtn:hover{border-color:var(--line2)}
.sbtn.ico{padding:0;width:38px;height:38px;display:grid;place-items:center;border-radius:0}
/* primary = the dark accent, matching the dark FAB that carries the same action */
.sbtn.prim{background:var(--accent);border-color:var(--accent);color:var(--ink)}
.sbtn.prim:hover{filter:brightness(1.15)}
/* close + select-all share one look: no fill, 3px dark outline, same height */
#selClose,#selAll{height:38px;background:none;border:3px solid var(--accent)}
#selClose:hover,#selAll:hover{border-color:var(--accent)}
.sbtn[aria-disabled="true"]{opacity:.4;pointer-events:none}
.sbtn[hidden]{display:none}
.sbtn.act{display:inline-flex;align-items:center;gap:7px}
.selcount b{font-weight:700;font-variant-numeric:tabular-nums}
/* On a phone the bar is tight: the actions collapse to their icon (aria-label carries the
   name) and the count keeps only its number. Everything spells itself out from 560px up. */
@media(max-width:559px){
  .sbtn.act .lbl,.selcount .lbl{display:none}
  .sbtn.act{padding:0;width:38px;height:38px;justify-content:center;border-radius:0}
}
/* the count sits on the dithered backdrop → give it a cream pill so it stays readable */
.selcount{flex:0 1 auto;min-width:0;margin-right:auto;padding:7px 12px;border-radius:0;
  background:rgba(249,244,238,.88);font-size:13px;font-weight:600;color:var(--txt);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media(max-width:420px){.sbtn{padding:8px 11px;font-size:12px}.selcount{font-size:12px;padding:7px 10px}}

.toolbar{display:flex;align-items:center;gap:10px;padding-bottom:12px}
.filters{display:flex;gap:8px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none;-ms-overflow-style:none}
.filters::-webkit-scrollbar{display:none}
.chip{
  flex:none;padding:7px 13px;border-radius:0;font-size:13px;white-space:nowrap;
  background:var(--panel);border:1px solid var(--line);color:var(--txt2);transition:.15s;
}
.chip:hover{border-color:var(--line2)}
.chip.on{background:var(--txt);color:var(--ink);border-color:var(--txt);font-weight:600}

/* ---------- HOME: PHOTO LIBRARY (masonry, 3 columns) ---------- */
.gallery{padding:6px 0 calc(var(--safe-b) + 96px);column-count:3;column-gap:8px}
@media(min-width:560px){.gallery{column-count:4;column-gap:10px}}
@media(min-width:880px){.gallery{column-count:6}}
.pcard{position:relative;display:block;width:100%;margin:0 0 8px;overflow:hidden;cursor:pointer;background:var(--panel);
  break-inside:avoid;-webkit-column-break-inside:avoid;-webkit-touch-callout:none;user-select:none;
  transition:opacity .15s,transform .15s}   /* no border, no radius */
.pcard:hover{transform:translateY(-2px)}
.pcard:active{opacity:.85}
.pcard img{width:100%;height:auto;display:block;pointer-events:none}   /* natural ratio, no crop, no radius */
/* long-press → multi-select mode (checkbox per card) */
.pcard .pcheck{position:absolute;top:8px;right:8px;z-index:2;width:26px;height:26px;border-radius:0;
  display:none;place-items:center;color:#EFE9E2;background:rgba(0,0,0,.32);
  box-shadow:0 0 0 2px rgba(249,244,238,.92);transition:background .12s,box-shadow .12s}
.gallery.selecting .pcheck{display:grid;animation:pdelIn .14s ease}
.gallery.selecting .pcard{cursor:default}
.gallery.selecting .pcard:hover{transform:none}
@keyframes pdelIn{from{opacity:0}to{opacity:1}}
.pcard .pcheck svg{opacity:0;transition:opacity .1s}
.pcard.sel .pcheck{background:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.pcard.sel .pcheck svg{opacity:1}
.pcard.sel img{opacity:.8}
.pcard.sel{outline:3px solid var(--accent);outline-offset:-3px}

/* while selecting, the two FABs swap their icon (Import→trash, Caméra→download) */
.fab .ic-sel{display:none}
body.selmode .fab .ic-def{display:none}
body.selmode .fab .ic-sel{display:block}
body.selmode .fab.dim,.fab[aria-disabled="true"]{opacity:.4;pointer-events:none}   /* nothing selected → nothing to act on */

/* full-screen busy overlay (batch export progress) */
.busyov{position:fixed;inset:0;z-index:320;display:grid;place-items:center;padding:24px;
  background:rgba(249,244,238,.72);backdrop-filter:blur(4px);opacity:0;transition:opacity .18s}
.busyov.show{opacity:1}
.busybox{display:grid;justify-items:center;gap:14px}
.busyspin{width:38px;height:38px;display:block;overflow:visible}
.busyspin rect{fill:none;stroke-width:3;stroke-linejoin:miter}
.busyspin .bs-track{stroke:var(--line2)}
.busyspin .bs-trace{stroke:var(--accent);stroke-dasharray:100;stroke-dashoffset:100;
  animation:busytrace 1.6s cubic-bezier(.6,0,.4,1) infinite}
/* determinate mode: border fills according to real progress (set via ov.progress) */
.busyspin.det .bs-trace{animation:none;transition:stroke-dashoffset .25s ease-out}
@keyframes busytrace{0%{stroke-dashoffset:100}50%{stroke-dashoffset:0}100%{stroke-dashoffset:-100}}
@media (prefers-reduced-motion:reduce){.busyspin .bs-trace{animation-duration:3.2s}}
.busytxt{font-size:14px;font-weight:600;color:var(--txt)}

/* app-styled confirm dialog (no native modals) */
.cscrim{position:fixed;inset:0;z-index:300;display:grid;place-items:center;padding:24px;
  background:rgba(0,0,0,.45);backdrop-filter:blur(3px);opacity:0;transition:opacity .2s}
.cscrim.show{opacity:1}
.cbox{width:100%;max-width:320px;background:var(--bg);border-radius:var(--r-lg);
  padding:20px 18px 16px;box-shadow:0 24px 60px -20px rgba(0,0,0,.4);transform:translateY(8px);transition:transform .2s}
.cscrim.show .cbox{transform:none}
.cmsg{margin:0 0 16px;font-size:15px;line-height:1.45;color:var(--txt);text-align:center}
.crow{display:flex;gap:10px}
.cbtn{flex:1;padding:12px;border-radius:var(--r-md);font-size:14px;font-weight:600;
  background:var(--panel2);border:1px solid transparent;color:var(--txt);transition:filter .15s,background .15s}
.cbtn:hover{background:var(--line2)}
.cbtn.danger{background:var(--accent);border-color:var(--accent);color:var(--ink)}
.cbtn.danger:hover{background:var(--accent);filter:brightness(1.1)}

/* surimpression — aperçu de l'empilement entre deux prises */
.mxov{position:fixed;inset:0;z-index:300;display:grid;place-items:center;padding:20px;
  background:rgba(0,0,0,.62);backdrop-filter:blur(3px);opacity:0;transition:opacity .2s}
.mxov.show{opacity:1}
.mxov[hidden]{display:none}
.mxbox{width:100%;max-width:380px;max-height:100%;overflow:auto;background:var(--bg);border-radius:var(--r-lg);
  padding:14px;box-shadow:0 24px 60px -20px rgba(0,0,0,.4);transform:translateY(8px);transition:transform .2s}
.mxov.show .mxbox{transform:none}
.mxprev{display:block;width:100%;height:auto;max-height:46vh;object-fit:contain;background:#000;border-radius:var(--r-md)}
.mxstep{margin:12px 0 10px;font-size:13px;font-weight:600;color:var(--txt2);text-align:center}
.mxmodes{display:flex;gap:8px;overflow-x:auto;padding-bottom:12px;scrollbar-width:none}
.mxmodes[hidden]{display:none}   /* class rule would otherwise beat the UA [hidden] */
.mxmodes::-webkit-scrollbar{display:none}
.mxrow{display:flex;flex-wrap:wrap;gap:8px}
.mxrow .cbtn{flex:1 1 calc(50% - 4px);min-width:0}
/* opacity of the stacked layers */
.mxop{display:flex;align-items:center;gap:10px;padding-bottom:12px}
.mxop[hidden]{display:none}
.mxoplab{flex:none;font-size:12px;font-weight:600;color:var(--txt2)}
.mxopval{flex:none;min-width:28px;font-size:12px;font-weight:700;color:var(--txt);text-align:right;
  font-variant-numeric:tabular-nums}
.mxop input[type=range]{flex:1;min-width:0;-webkit-appearance:none;appearance:none;height:4px;border-radius:0;
  background:var(--line2);outline-offset:6px}

/* ---------- DETAIL / EDITOR ---------- */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(3px);opacity:0;
  pointer-events:none;transition:.25s;z-index:50}
.scrim.show{opacity:1;pointer-events:auto}
.editor{
  position:fixed;z-index:60;
  /* inverted theme: dark ground, cream ink */
  --bg:#292929;--fg:#EFE9E2;--accent:#EFE9E2;--accent2:#EFE9E2;--ink:#292929;
  --txt:#EFE9E2;--txt2:rgba(239,233,226,.72);--txt3:rgba(239,233,226,.5);
  --panel:rgba(239,233,226,.1);--panel2:rgba(239,233,226,.16);--line:rgba(239,233,226,.16);--line2:rgba(239,233,226,.3);
  background:var(--bg);
  display:flex;flex-direction:column;
  transition:transform .34s cubic-bezier(.2,.8,.2,1);
}
/* mobile: bottom sheet full */
.editor{left:0;right:0;bottom:0;top:0;transform:translateY(100%)}
.editor.open{transform:translateY(0)}
@media(min-width:880px){
  .editor{left:auto;top:0;bottom:0;width:520px;transform:translateX(100%);
    border-left:1px solid var(--line);box-shadow:-30px 0 60px -30px rgba(0,0,0,.6)}
  .editor.open{transform:translateX(0)}
}
.ed-head{display:flex;align-items:center;gap:8px;padding:calc(var(--safe-t) + 12px) 14px 12px;
  background:var(--bg);color:var(--fg);flex:none}
.ed-head .x{position:relative;width:34px;height:34px;border-radius:var(--r-md);background:none;display:grid;place-items:center;flex:none;transition:background .15s}
.ed-head .x:hover{background:rgba(239,233,226,.08)}
.ed-head .x::before,.ed-head .hfav::before{content:"";position:absolute;inset:-5px}  /* ≥44px touch target */
.ed-head .t{min-width:0;flex:1}
.ed-head .t h2{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.ed-head .t span{font-size:11px;color:var(--txt3)}
.ed-head .hfav{position:relative;width:34px;height:34px;border-radius:var(--r-md);background:rgba(239,233,226,.06);display:grid;place-items:center;flex:none;transition:background .15s}
.ed-head .hfav:hover{background:rgba(239,233,226,.12)}
.ed-head .hfav.on{color:var(--fg)}

/* preview fills the space above the dock — the photo is the hero */
.preview{position:relative;width:100%;background:var(--bg);overflow:hidden;flex:1;min-height:0}
.preview canvas{width:100%;height:100%;object-fit:contain;display:block;box-sizing:border-box;padding:12px}
.preview{touch-action:pan-y}
.preview canvas{will-change:transform}
.pv-ghost{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;box-sizing:border-box;padding:12px;pointer-events:none;user-select:none;will-change:transform}
.pv-ghost[hidden]{display:none}
.preview.cropping canvas{padding:30px}   /* margin around the image so crop handles stay reachable (keep = PAD in imgDispRect) */

/* crop tool — adjustable box with rule-of-thirds (ratio/apply controls live in the dock) */
.crop{position:absolute;inset:0;z-index:6;touch-action:none}
.crop[hidden]{display:none}
.crop-box{position:absolute;box-sizing:border-box;border:1px solid rgba(249,244,238,.95);
  box-shadow:0 0 0 9999px rgba(0,0,0,.55);cursor:move}
.crop-box::before,.crop-box::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.32}
.crop-box::before{background:
  linear-gradient(90deg,transparent calc(33.33% - .5px),#EFE9E2 calc(33.33% - .5px),#EFE9E2 calc(33.33% + .5px),transparent calc(33.33% + .5px)),
  linear-gradient(90deg,transparent calc(66.66% - .5px),#EFE9E2 calc(66.66% - .5px),#EFE9E2 calc(66.66% + .5px),transparent calc(66.66% + .5px))}
.crop-box::after{background:
  linear-gradient(0deg,transparent calc(33.33% - .5px),#EFE9E2 calc(33.33% - .5px),#EFE9E2 calc(33.33% + .5px),transparent calc(33.33% + .5px)),
  linear-gradient(0deg,transparent calc(66.66% - .5px),#EFE9E2 calc(66.66% - .5px),#EFE9E2 calc(66.66% + .5px),transparent calc(66.66% + .5px))}
.crop-h{position:absolute;width:44px;height:44px;z-index:3;touch-action:none}   /* 44px = accessible min touch target */
.crop-h::before{content:"";position:absolute;width:16px;height:16px;border:2px solid #EFE9E2;border-radius:0}
.crop-h.tl{left:-22px;top:-22px}.crop-h.tl::before{left:6px;top:6px;border-right:none;border-bottom:none}
.crop-h.tr{right:-22px;top:-22px}.crop-h.tr::before{right:6px;top:6px;border-left:none;border-bottom:none}
.crop-h.bl{left:-22px;bottom:-22px}.crop-h.bl::before{left:6px;bottom:6px;border-right:none;border-top:none}
.crop-h.br{right:-22px;bottom:-22px}.crop-h.br::before{right:6px;bottom:6px;border-left:none;border-top:none}
/* edge handles — drag any side with one finger; free-ratio only (ratio-locked keeps corner-only) */
.crop-h.edge{z-index:2}   /* corner handles win hit-testing over edges when both overlap on a thin box */
.crop-h.edge::before{border:none;background:#EFE9E2;border-radius:0}
.crop-h.t,.crop-h.b{left:50%;width:64px;height:28px;margin-left:-32px;cursor:ns-resize}
.crop-h.l,.crop-h.r{top:50%;width:28px;height:64px;margin-top:-32px;cursor:ew-resize}
.crop-h.t{top:-14px}.crop-h.b{bottom:-14px}
.crop-h.l{left:-14px}.crop-h.r{right:-14px}
.crop-h.t::before,.crop-h.b::before{left:50%;top:50%;width:26px;height:3px;transform:translate(-50%,-50%)}
.crop-h.l::before,.crop-h.r::before{left:50%;top:50%;width:3px;height:26px;transform:translate(-50%,-50%)}
.crop-box:not(.free) .crop-h.edge{display:none}   /* ratio locked: corners only, so the ratio can't be broken by mistake */
.crop-grid{position:absolute;inset:0;pointer-events:none;display:none;opacity:.4;
  background:
   linear-gradient(90deg,transparent calc(33.33% - .5px),#EFE9E2 calc(33.33% - .5px),#EFE9E2 calc(33.33% + .5px),transparent calc(33.33% + .5px)),
   linear-gradient(90deg,transparent calc(66.66% - .5px),#EFE9E2 calc(66.66% - .5px),#EFE9E2 calc(66.66% + .5px),transparent calc(66.66% + .5px)),
   linear-gradient(0deg,transparent calc(33.33% - .5px),#EFE9E2 calc(33.33% - .5px),#EFE9E2 calc(33.33% + .5px),transparent calc(33.33% + .5px)),
   linear-gradient(0deg,transparent calc(66.66% - .5px),#EFE9E2 calc(66.66% - .5px),#EFE9E2 calc(66.66% + .5px),transparent calc(66.66% + .5px))}
/* single-adjustment slider (reused by the tool-edit view) */
.range{position:relative;height:26px;display:flex;align-items:center}
.range .track{position:absolute;left:0;right:0;height:4px;border-radius:0;background:var(--line2)}
.range .midmark{position:absolute;top:50%;transform:translateY(-50%);width:1px;height:11px;background:var(--txt3);opacity:.6}
.range .fill{position:absolute;height:4px;border-radius:0;background:var(--accent);opacity:.9}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;background:transparent;position:relative;z-index:2;margin:0;height:26px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:0;
  background:var(--accent);border:2px solid var(--bg);box-shadow:0 0 0 1px var(--line2),0 2px 8px rgba(0,0,0,.25);cursor:grab}
input[type=range]::-webkit-slider-thumb:active{cursor:grabbing;transform:scale(1.12)}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:0;background:var(--accent);border:2px solid var(--bg)}

/* header action buttons (reset / export) */
.ed-head .hbtn{position:relative;width:34px;height:34px;border-radius:var(--r-md);background:none;
  display:grid;place-items:center;flex:none;color:var(--fg);transition:background .15s,filter .15s}
.ed-head .hbtn:hover{background:rgba(239,233,226,.08)}
.ed-head .hbtn::before{content:"";position:absolute;inset:-5px}   /* ≥44px touch target */
.ed-head .hbtn.exp.busy{pointer-events:none}
.ed-head .hbtn .bs-ring{display:none;position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.ed-head .hbtn.busy .bs-ring{display:block}
.ed-head .hbtn .bs-ring rect{fill:none;stroke-width:3;stroke-linejoin:miter}
.ed-head .hbtn .bs-ring .bs-track{stroke:rgba(239,233,226,.16)}
.ed-head .hbtn .bs-ring .bs-trace{stroke:var(--accent);stroke-dasharray:100;stroke-dashoffset:100;
  animation:busytrace 1.6s cubic-bezier(.6,0,.4,1) infinite}
.ed-head .hbtn.save{background:rgba(239,233,226,.08);color:var(--fg)}        /* primary action */
.ed-head .hbtn.save:hover{background:rgba(239,233,226,.14)}
.ed-head .hbtn[hidden]{display:none}

/* ---------- EDITOR DOCK (VSCO-style): a rail above a two-tab menu ---------- */
.ed-dock{flex:none;background:var(--bg);border-top:var(--div) solid var(--fg)}
.ed-rail{display:flex;align-items:center;min-height:89px;padding:7px 14px}   /* = presets rail height (56 thumb + label + padding) so Filtres/Réglages swap without resizing the photo */
.ed-rail.scroller{overflow-x:auto;gap:11px;scrollbar-width:none;-ms-overflow-style:none}
.ed-rail.scroller::-webkit-scrollbar{display:none}
/* presets rail — thumbnail chips */
.pchip{flex:none;display:flex;flex-direction:column;align-items:center;gap:7px;width:60px;cursor:pointer;background:none;padding:0}
.pchip canvas{width:56px;height:56px;border-radius:0;display:block;background:var(--panel);
  border:var(--div) solid transparent;transition:border-color .15s,transform .15s}
.pchip:hover canvas{transform:translateY(-2px)}
.pchip.on canvas{border-color:var(--accent)}
.pchip:active canvas{transform:translateY(0) scale(.96)}
.pchip span{font-size:10px;line-height:1.2;color:var(--txt3);max-width:60px;text-align:center;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color .15s}
.pchip.on span{color:var(--accent);font-weight:600}
/* tools rail — labelled chips (show the live value when active) */
.tchip{flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  min-width:74px;height:60px;padding:0 13px;border-radius:0;background:none;
  border:var(--div) solid transparent;color:var(--txt2);cursor:pointer;transition:.15s}
.tchip:hover{color:var(--txt)}
/* dock ratio chips (crop) */
.rchip{flex:none;align-self:center;padding:9px 14px;border-radius:0;font-size:12.5px;font-weight:600;
  white-space:nowrap;background:var(--panel);border:1px solid transparent;color:var(--txt2);cursor:pointer;transition:.15s}
.rchip:hover{color:var(--txt)}
.rchip.on{background:var(--accent);color:var(--ink);border-color:var(--accent)}
/* crop dock: ratio chips row + straighten slider row */
.ed-rail.cropedit{flex-direction:column;align-items:stretch;gap:9px;min-height:0;max-height:44vh;overflow-y:auto;padding:10px 14px}
.crop-auto{display:flex;justify-content:center;gap:10px;padding-top:2px}
.auto-btn svg{vertical-align:-3px;margin-right:5px}
.auto-btn{padding:8px 18px;border-radius:0;font-size:12.5px;font-weight:600;
  background:var(--panel);border:1px solid transparent;color:var(--txt);transition:.15s}
.auto-btn:hover{color:var(--accent)}
.crop-chips{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none}
.crop-chips::-webkit-scrollbar{display:none}
.crop-straight{display:flex;align-items:center;gap:11px}
.cs-lab{font-size:12px;font-weight:600;color:var(--txt2);white-space:nowrap;flex:1}
.cs-btn{width:44px;height:44px;border-radius:0;background:var(--panel);color:var(--txt);font-size:22px;line-height:1;
  display:grid;place-items:center;border:1px solid transparent;touch-action:manipulation;user-select:none;transition:.15s}
.cs-btn:active{background:var(--accent);color:var(--ink)}
.cs-val{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--accent);min-width:58px;text-align:center;padding:8px 0}
.cs-val.zero{color:var(--txt3)}
.tchip .tico{display:grid;place-items:center;height:24px;color:var(--txt2);transition:color .15s}
.tchip .tlabel{font-size:12px;font-weight:600;white-space:nowrap;line-height:1.1}
.tchip.act{border-color:var(--fg)}
.tchip.act .tico{color:var(--accent)}
.tchip.act .tlabel{color:var(--accent)}
/* tool-edit — one full-width slider */
.ed-rail.editing{flex-direction:column;align-items:stretch;gap:11px;padding:16px 20px}
.framepanel{flex-direction:column;align-items:stretch;gap:10px}
.frame-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.fbtn{display:inline-flex;align-items:center;gap:7px;padding:9px 14px;border:1px solid var(--line,#444);background:transparent;color:var(--txt2);font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.fbtn.on{border-color:var(--fg);color:var(--accent)}
.fbtn i{width:14px;height:14px;border:1px solid #888;display:inline-block}
.fbtn i.rainbow{background:conic-gradient(red,yellow,lime,cyan,blue,magenta,red)}
.frame-picker{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.tool-val{text-align:center;font-variant-numeric:tabular-nums;font-weight:700;font-size:16px;color:var(--txt)}
/* two-tab menu */
.ed-menu{display:flex;align-items:stretch;border-top:var(--div) solid var(--fg);padding-bottom:var(--safe-b);background:#1f1f1f}   /* footer: a touch darker than the editor ground */
.ed-menu .m{flex:1;padding:11px 6px;background:none;font-size:12px;font-weight:600;letter-spacing:.2px;
  color:var(--txt3);transition:.15s;display:flex;flex-direction:column;align-items:center;gap:4px}   /* dimmed via colour, not opacity, so the divider stays solid cream */
.ed-menu:not(.editing) .m+.m{border-left:var(--div) solid var(--fg)}   /* divider between the two buttons */
.ed-menu .m svg{display:block}
.ed-menu .m:hover{color:var(--txt2)}
.ed-menu .m.on{color:var(--fg)}
/* tool-edit menu = cancel · label · confirm */
.ed-menu.editing{align-items:center;padding:5px 8px;padding-bottom:calc(var(--safe-b) + 5px)}
.ed-menu .ticon{flex:none;width:60px;height:44px;display:grid;place-items:center;background:none;color:var(--fg);opacity:.7}
.ed-menu .ticon.ok{opacity:1}
.ed-menu .tname{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;
  font-size:13px;font-weight:600;color:var(--fg)}
.ed-menu .tname svg{display:block}

/* import progress — slim bar + count, non-blocking, only shown when an import takes a while */
.impg{position:fixed;left:0;right:0;top:0;z-index:310;pointer-events:none;opacity:0;transition:opacity .2s}
.impg.show{opacity:1}
.impg .bar{height:3px;width:100%;background:rgba(239,233,226,.14)}
.impg .bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s ease-out}
.impg .lab{position:absolute;top:calc(var(--safe-t) + 14px);left:50%;transform:translateX(-50%);
  padding:7px 14px;border-radius:0;background:var(--accent);color:var(--ink);
  font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;
  box-shadow:0 6px 18px rgba(0,0,0,.25)}

/* ---------- DESKTOP (≥1024px) ----------
   Library: wider canvas, denser grid. Editor: full-screen split — photo on the left,
   controls in a fixed side panel on the right (no more phone-sized drawer). */
@media(min-width:1024px){
  .app{padding:0 40px}
  header.top{padding-top:calc(var(--safe-t) + 24px)}
  .gallery{column-count:6;column-gap:14px;padding-top:10px}
  .pcard{margin-bottom:14px}
  .brand{left:40px;bottom:24px}
  .fabs{right:32px;bottom:28px}

  .editor{inset:0;width:auto;border:0;box-shadow:none;
    display:grid;grid-template-columns:minmax(0,1fr) 400px;grid-template-rows:auto minmax(0,1fr);
    transform:none;opacity:0;visibility:hidden;pointer-events:none;
    transition:opacity .22s ease-out,visibility 0s .22s}
  .editor.open{transform:none;opacity:1;visibility:visible;pointer-events:auto;
    transition:opacity .22s ease-out,visibility 0s}
  .ed-head{grid-column:1/-1;padding:12px 24px}
  .ed-head .t h2{position:static;width:auto;height:auto;margin:0;clip:auto;overflow:visible;
    font-size:15px;font-weight:600;color:var(--fg);white-space:nowrap;text-overflow:ellipsis}
  .preview{grid-column:1;grid-row:2;background:var(--bg)}
  .preview canvas,.pv-ghost{padding:40px}

  .ed-dock{grid-column:2;grid-row:2;display:flex;flex-direction:column;min-height:0;
    border-top:0;border-left:var(--div) solid var(--fg)}
  .ed-menu{order:-1;border-top:0;border-bottom:var(--div) solid var(--fg);padding-bottom:0}
  .ed-menu .m{flex-direction:row;justify-content:center;gap:8px;padding:15px 6px}
  .ed-menu.editing{padding:6px 10px}
  .ed-rail{flex:1;min-height:0}
  .ed-rail.scroller{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));align-content:start;align-items:start;
    gap:18px 12px;padding:20px;overflow-x:hidden;overflow-y:auto}
  .ed-rail.scroller:has(.tchip){grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
  .pchip{width:auto;min-width:0}
  .pchip canvas{width:100%;height:auto;aspect-ratio:1}
  .pchip span{max-width:100%;font-size:11px;white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .tchip{min-width:0;width:100%;height:78px}
  .ed-rail.editing{justify-content:flex-start;padding:36px 28px}
  .ed-rail.cropedit{max-height:none;overflow-y:auto;padding:20px}
}
@media(min-width:1440px){
  .gallery{column-count:7}
  .editor{grid-template-columns:minmax(0,1fr) 440px}
}
@media(min-width:1800px){.gallery{column-count:8}}

.toast{position:fixed;bottom:calc(var(--safe-b) + 22px);left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--accent);color:var(--ink);padding:11px 18px;border-radius:var(--r-md);font-size:13px;font-weight:600;
  z-index:100;opacity:0;transition:.25s;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.brand{position:fixed;left:16px;bottom:calc(var(--safe-b) + 16px);z-index:2;height:44px;width:auto;pointer-events:none}

.fabs{position:fixed;right:16px;bottom:calc(var(--safe-b) + 16px);z-index:30;display:flex;flex-direction:column;align-items:center;gap:10px}
.fab{width:58px;height:58px;border-radius:0;background:var(--accent);color:var(--ink);
  display:grid;place-items:center;box-shadow:0 8px 24px -6px rgba(0,0,0,.28);transition:transform .15s,filter .15s}
.fab:hover{transform:translateY(-2px);filter:brightness(1.06)}
.fab:active{transform:translateY(0)}
.fab[hidden]{display:none}
.fab.sec{background:var(--bg);color:var(--txt);box-shadow:0 6px 18px rgba(0,0,0,.18)}
.fab.sec:hover{background:var(--line2);filter:none}

/* keyboard focus — one consistent ring everywhere */
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:var(--r-sm)}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;
    transition-duration:.001ms!important;scroll-behavior:auto!important}
}
</style>
</head>
<body>
<img class="brand" src="logo.svg" alt="fotn" aria-hidden="true">
<div class="app">
  <header class="top">
    <!-- selection bar: shown while a multi-selection is active -->
    <div class="selbar" id="selbar" role="toolbar" aria-label="Actions de sélection" hidden>
      <button class="sbtn ico" id="selClose" title="Quitter la sélection" aria-label="Quitter la sélection">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M11.9997 10.5865L16.9495 5.63672L18.3637 7.05093L13.4139 12.0007L18.3637 16.9504L16.9495 18.3646L11.9997 13.4149L7.04996 18.3646L5.63574 16.9504L10.5855 12.0007L5.63574 7.05093L7.04996 5.63672L11.9997 10.5865Z"></path></svg>
      </button>
      <button class="sbtn" id="selAll">Tout sélectionner</button>
    </div>
  </header>

  <main>
    <div id="gallery" class="gallery"></div>
  </main>
</div>

<!-- The two FABs double as the multi-select actions: while selecting, Import→Supprimer and Caméra→Télécharger -->
<div class="fabs">
  <button class="fab sec" id="fabPaste" title="Coller les réglages" aria-label="Coller les réglages sur la sélection" hidden>
    <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4V2H17V4H20.0066C20.5552 4 21 4.44495 21 4.9934V21.0066C21 21.5552 20.5551 22 20.0066 22H3.9934C3.44476 22 3 21.5551 3 21.0066V4.9934C3 4.44476 3.44495 4 3.9934 4H7ZM7 6H5V20H19V6H17V8H7V6ZM9 4V6H15V4H9Z"></path></svg>
  </button>
  <button class="fab sec" id="fabMx" title="Surimpression : sélectionne 2 ou 3 photos" aria-label="Surimpression (2 à 3 photos)" hidden>
    <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path id="selMxIc"></path></svg>
  </button>
  <button class="fab sec" id="fabImport" title="Importer une photo" aria-label="Importer une photo">
    <svg class="ic-def" width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M21 15V18H24V20H21V23H19V20H16V18H19V15H21ZM21.0082 3C21.556 3 22 3.44495 22 3.9934V13H20V5H4V18.999L14 9L17 12V14.829L14 11.8284L6.827 19H14V21H2.9918C2.44405 21 2 20.5551 2 20.0066V3.9934C2 3.44476 2.45531 3 2.9918 3H21.0082ZM8 7C9.10457 7 10 7.89543 10 9C10 10.1046 9.10457 11 8 11C6.89543 11 6 10.1046 6 9C6 7.89543 6.89543 7 8 7Z"></path></svg>
    <svg class="ic-sel" width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M17 6H22V8H20V21C20 21.5523 19.5523 22 19 22H5C4.44772 22 4 21.5523 4 21V8H2V6H7V3C7 2.44772 7.44772 2 8 2H16C16.5523 2 17 2.44772 17 3V6ZM18 8H6V20H18V8ZM9 11H11V17H9V11ZM13 11H15V17H13V11ZM9 4V6H15V4H9Z"></path></svg>
  </button>
  <button class="fab" id="fabCam" title="Prendre une photo" aria-label="Prendre une photo">
    <svg class="ic-def" width="25" height="25" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M9.82843 5L7.82843 7H4V19H20V7H16.1716L14.1716 5H9.82843ZM9 3H15L17 5H21C21.5523 5 22 5.44772 22 6V20C22 20.5523 21.5523 21 21 21H3C2.44772 21 2 20.5523 2 20V6C2 5.44772 2.44772 5 3 5H7L9 3ZM12 18C8.96243 18 6.5 15.5376 6.5 12.5C6.5 9.46243 8.96243 7 12 7C15.0376 7 17.5 9.46243 17.5 12.5C17.5 15.5376 15.0376 18 12 18ZM12 16C13.933 16 15.5 14.433 15.5 12.5C15.5 10.567 13.933 9 12 9C10.067 9 8.5 10.567 8.5 12.5C8.5 14.433 10.067 16 12 16Z"></path></svg>
    <svg class="ic-sel" width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M13 10H18L12 16L6 10H11V3H13V10ZM4 19H20V12H22V20C22 20.5523 21.5523 21 21 21H3C2.44772 21 2 20.5523 2 20V12H4V19Z"></path></svg>
  </button>
</div>
<!-- native system camera (capture) + library import file inputs -->
<input id="camInput" type="file" accept="image/*" capture="environment" hidden>
<input id="upload" type="file" accept="image/*" multiple hidden>

<!-- SURIMPRESSION — depuis la sélection (2 ou 3 photos) : le résultat devient une nouvelle photo -->
<div class="mxov" id="mxov" hidden role="dialog" aria-modal="true" aria-labelledby="mxTitle">
  <div class="mxbox">
    <canvas id="mxPrev" class="mxprev" aria-label="Aperçu de la surimpression" role="img"></canvas>
    <div class="mxstep" id="mxTitle" role="status" aria-live="polite">Aucun calque</div>
    <div class="mxmodes" id="mxModes" role="group" aria-label="Mode de fusion"></div>
    <div class="mxop" id="mxOpRow">
      <span class="mxoplab">Opacité</span>
      <input id="mxOpacity" type="range" min="0" max="100" step="1" value="60" aria-label="Opacité des calques">
      <span class="mxopval" id="mxOpVal">60</span>
    </div>
    <div class="mxrow">
      <button class="cbtn" id="mxCancel">Annuler</button>
      <button class="cbtn danger" id="mxOk">Appliquer</button>
    </div>
  </div>
</div>

<!-- EDITOR -->
<div class="scrim" id="scrim"></div>
<div class="editor" id="editor" role="dialog" aria-modal="true" aria-labelledby="edName">
  <div class="ed-head">
    <button class="x" id="edClose" aria-label="Fermer">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M11.9997 10.5865L16.9495 5.63672L18.3637 7.05093L13.4139 12.0007L18.3637 16.9504L16.9495 18.3646L11.9997 13.4149L7.04996 18.3646L5.63574 16.9504L10.5855 12.0007L5.63574 7.05093L7.04996 5.63672L11.9997 10.5865Z"></path></svg>
    </button>
    <div class="t"><h2 id="edName">—</h2><span id="edPos" aria-live="polite"></span></div>
    <button class="hbtn" id="btnReset" aria-label="Réinitialiser" title="Réinitialiser">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M18.5374 19.5674C16.7844 21.0831 14.4993 22 12 22C6.47715 22 2 17.5228 2 12C2 6.47715 6.47715 2 12 2C17.5228 2 22 6.47715 22 12C22 14.1361 21.3302 16.1158 20.1892 17.7406L17 12H20C20 7.58172 16.4183 4 12 4C7.58172 4 4 7.58172 4 12C4 16.4183 7.58172 20 12 20C14.1502 20 16.1022 19.1517 17.5398 17.7716L18.5374 19.5674Z"></path></svg>
    </button>
    <button class="hbtn" id="btnDelete" aria-label="Supprimer" title="Supprimer">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M17 6H22V8H20V21C20 21.5523 19.5523 22 19 22H5C4.44772 22 4 21.5523 4 21V8H2V6H7V3C7 2.44772 7.44772 2 8 2H16C16.5523 2 17 2.44772 17 3V6ZM18 8H6V20H18V8ZM9 11H11V17H9V11ZM13 11H15V17H13V11ZM9 4V6H15V4H9Z"></path></svg>
    </button>
    <button class="hbtn" id="btnCopy" aria-label="Copier les réglages" title="Copier les réglages">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6.9998 6V3C6.9998 2.44772 7.44752 2 7.9998 2H19.9998C20.5521 2 20.9998 2.44772 20.9998 3V17C20.9998 17.5523 20.5521 18 19.9998 18H16.9998V20.9991C16.9998 21.5519 16.5499 22 15.993 22H4.00666C3.45059 22 3 21.5554 3 20.9991L3.0026 7.00087C3.0027 6.44811 3.45264 6 4.00942 6H6.9998ZM5.00242 8L5.00019 20H14.9998V8H5.00242ZM8.9998 6H16.9998V16H18.9998V4H8.9998V6Z"></path></svg>
    </button>
    <button class="hbtn exp" id="btnExport" aria-label="Exporter" title="Exporter" hidden>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M13 10H18L12 16L6 10H11V3H13V10ZM4 19H20V12H22V20C22 20.5523 21.5523 21 21 21H3C2.44772 21 2 20.5523 2 20V12H4V19Z"></path></svg>
    </button>
    <button class="hbtn save" id="btnSave" aria-label="Enregistrer" title="Enregistrer">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M9.9997 15.1709L19.1921 5.97852L20.6063 7.39273L9.9997 17.9993L3.63574 11.6354L5.04996 10.2212L9.9997 15.1709Z"></path></svg>
    </button>
  </div>

  <div class="preview" id="preview">
    <canvas id="pvCanvas" role="img" aria-label="Aperçu de la recette appliquée à la photo"></canvas>
    <!-- crop overlay (just the adjustable box; ratio/apply controls live in the dock) -->
    <div class="crop" id="crop" hidden>
      <div class="crop-grid" aria-hidden="true"></div>
      <div class="crop-box" id="cropBox">
        <span class="crop-h tl" data-c="tl"></span>
        <span class="crop-h tr" data-c="tr"></span>
        <span class="crop-h bl" data-c="bl"></span>
        <span class="crop-h br" data-c="br"></span>
        <span class="crop-h edge t" data-c="t"></span>
        <span class="crop-h edge b" data-c="b"></span>
        <span class="crop-h edge l" data-c="l"></span>
        <span class="crop-h edge r" data-c="r"></span>
      </div>
    </div>
  </div>

  <!-- VSCO-style dock: rail (presets / tools / one slider) above a two-tab menu -->
  <div class="ed-dock" id="edDock">
    <div class="ed-rail" id="edRail"></div>
    <div class="ed-menu" id="edMenu"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>

// Turn a container of role=radio buttons into a keyboard radiogroup:
// roving tabindex + arrow/Home/End navigation (selection follows focus).
function wireRadios(group){
  const radios=[...group.querySelectorAll('[role=radio]')];
  if(!radios.length)return;
  let ci=radios.findIndex(b=>b.getAttribute('aria-checked')==='true');
  if(ci<0)ci=0;
  radios.forEach((b,i)=>b.tabIndex=i===ci?0:-1);
  const rg=group.getAttribute('data-rg');
  group.onkeydown=e=>{
    const i=radios.indexOf(document.activeElement);if(i<0)return;
    let n=null;const k=e.key;
    if(k==='ArrowRight'||k==='ArrowDown')n=(i+1)%radios.length;
    else if(k==='ArrowLeft'||k==='ArrowUp')n=(i-1+radios.length)%radios.length;
    else if(k==='Home')n=0;else if(k==='End')n=radios.length-1;else return;
    e.preventDefault();
    const val=radios[n].getAttribute('data-rv');
    radios[n].click();                 // selects -> rebuilds the group(s)
    const sel=document.querySelector(`[data-rg="${rg}"] [data-rv="${val}"]`);
    if(sel)sel.focus();
  };
}

//// ---------- 3D LUT CACHE ----------
// Each film look is a Hald-CLUT PNG (125×125 = 25³ nodes) baked in Lightroom.
// Load it once into a Float32 cube; renderRecipe samples it trilinearly.
const LUT_N=25;
const LUTS={};
let lutRepaintScheduled=false;
function onLutReady(){
  if(lutRepaintScheduled)return;lutRepaintScheduled=true;
  requestAnimationFrame(()=>{lutRepaintScheduled=false;
    if($('#editor').classList.contains('open')){paint();if(edMode==='presets'&&!toolK)paintPresetRail();}
  });
}
function loadLUT(file){
  if(LUTS[file])return LUTS[file];
  const o={ready:false,data:null,n:LUT_N,img:new Image()};
  LUTS[file]=o;
  o.img.onload=()=>{
    // 125×125 = one pixel per node; larger (e.g. 1000×1000, 8×8 blocks per node, the
    // round-trip format for web tools that recompress) is read at each block's centre.
    const N=LUT_N, side=125, W=o.img.naturalWidth||side, bs=Math.max(1,Math.round(W/side));
    const S=side*bs, c=document.createElement('canvas');c.width=S;c.height=S;
    const cx=c.getContext('2d',{willReadFrequently:true});cx.drawImage(o.img,0,0,S,S);
    const bd=cx.getImageData(0,0,S,S).data, q=bs>>1, d=new Uint8ClampedArray(side*side*4);
    for(let y=0;y<side;y++)for(let x=0;x<side;x++){
      const si=((y*bs+q)*S+x*bs+q)*4, di=(y*side+x)*4;d[di]=bd[si];d[di+1]=bd[si+1];d[di+2]=bd[si+2];}
    const data=new Float32Array(N*N*N*3);
    for(let i=0;i<N*N*N;i++){
      const r=i%N, g=((i/N)|0)%N, b=(i/(N*N))|0;
      const px=i%side, py=(i/side)|0, off=(py*side+px)*4;
      const ci=(b*N*N+g*N+r)*3;
      data[ci]=d[off]/255; data[ci+1]=d[off+1]/255; data[ci+2]=d[off+2]/255;
    }
    o.data=data;o.ready=true;onLutReady();
  };
  o.img.onerror=()=>{};
  o.img.src=file;
  return o;
}

const NEUTRAL={};

// Merge a preset (P) with live user adjustments (A) into per-pixel constants.
// k = preset intensity (0..1): scales the PRESET toward neutral, while the
// universal user adjustments always apply at full strength.
function buildOps(P,A){
  A=A||NEUTRAL;
  const k=(A.intensity==null?100:A.intensity)/100;
  const L=P.lut?LUTS[P.lut]:null, lutReady=!!(L&&L.ready);   // the film look is a 3D LUT
  const warm=((P.temp||0)*k+(A.temperature||0))/100;
  const grn =((P.tint||0)*k+(A.tint||0))/100;
  const rG=1+0.22*warm, bG=1-0.22*warm, gG=1-0.10*grn;
  const exp=Math.pow(2,(A.exposure||0)/100*0.85);           // perceptual stops (was harsh linear ×0.45–1.55)
  const pSat=P.mono?1:lerp(1,(P.sat==null?1:P.sat),k);      // mono keeps colour for the blend
  const sat=Math.max(0,pSat*(1+(A.saturation||0)/100));
  // user contrast is ADDITIVE over the preset's baked contrast (not multiplicative) + clamped,
  // so a punchy LUT and a slider push can't compound into a blown-out image.
  const con=clamp(lerp(1,(P.con==null?1:P.con),k)+(A.contrast||0)/100*0.5,0.4,2.0);
  const hi=(A.highlights||0)/100*4;
  const sh=(A.shadows||0)/100*4;
  const lift=clamp((P.lift||0)*k+(A.fade||0)/100*0.45,0,0.7);
  const grain=clamp((P.grain||0)*k+(A.grain||0)/100*2,0,3);
  const vig=clamp((P.vig||0)*k+(A.vignette||0)/100*0.55,0,0.85);
  const hal=clamp((P.hal||0)*k*1.6+(A.halation||0)/100*1.8,0,2.8);
  const bloom=clamp((P.bloom||0)*k*1.6+(A.bloom||0)/100*1.7,0,2.6);
  const lens=clamp((A.lens||0)/100,0,1);
  const gSize=(A.grainSize==null?40:A.grainSize)/100;
  const sharp=clamp((A.sharpness||0)/100,0,1), clar=clamp((A.clarity||0)/100,-1,1);
  const baseMx=P.mx||I3, mx=baseMx===I3?I3:baseMx.map((v,i)=>lerp(I3[i],v,k));
  return {rG,gG,bG,exp,sat,con,hi,sh,lift,grain,vig,hal,bloom,lens,gSize,sharp,clar,
    split:(P.split||0)*k, splitS:P.splitS||[0,0,0], splitH:P.splitH||[0,0,0],
    mx,
    lut:lutReady?L.data:null, lutN:lutReady?L.n:LUT_N, lutK:k,   // LUT applied first, blended by intensity
    mono:(!!P.mono)&&!P.lut, monoK:k, filt:P.filt||[0.30,0.59,0.11], tone:P.tone||null};
}

// Cover-draw an image into a w×h context (object-fit: cover).
function drawCover(ctx,img,w,h){
  const iw=img.naturalWidth||img.videoWidth||img.width||w, ih=img.naturalHeight||img.videoHeight||img.height||h;
  const s=Math.max(w/iw,h/ih), dw=iw*s, dh=ih*s;
  ctx.drawImage(img,(w-dw)/2,(h-dh)/2,dw,dh);
}

// Render a preset (+ live adjustments) onto a canvas at w×h from a source image.
// opts.mirror flips horizontally (selfie); opts.noGrain skips grain (live feed).
function renderRecipe(src,P,A,canvas,w,h,opts){
  canvas.width=w;canvas.height=h;
  const ctx=canvas.getContext('2d',{willReadFrequently:true});
  ctx.imageSmoothingQuality='high';   // big photos shrink with a proper filter: default smoothing aliases into noise the LUT amplifies
  const ready=src&&(src.naturalWidth||src.videoWidth||src.width);
  if(!ready){ctx.fillStyle='#151515';ctx.fillRect(0,0,w,h);return;}
  if(opts&&opts.crop){const c=opts.crop;
    if(c.rot){                                   // straighten: rotate the source about the crop centre
      const ccx=c.sx+c.sw/2, ccy=c.sy+c.sh/2, scl=w/c.sw;
      ctx.save();ctx.translate(w/2,h/2);ctx.scale(scl,scl);ctx.rotate(c.rot);ctx.drawImage(src,-ccx,-ccy);ctx.restore();
    } else ctx.drawImage(src,c.sx,c.sy,c.sw,c.sh,0,0,w,h);

  else drawCover(ctx,src,w,h);

  const LD=O.lut, LN=O.lutN, LN1=O.lutN-1, LNN=O.lutN*O.lutN, LK=O.lutK;   // LUT locals
  let p=0;
  for(let y=0;y<h;y++){
    for(let x=0;x<w;x++,p+=4){
      let r=d[p]/255, g=d[p+1]/255, b=d[p+2]/255;
      // 0. film LUT (trilinear) — the whole look, blended by intensity
      if(LD){
        let fr=r<0?0:r>1?1:r, fg=g<0?0:g>1?1:g, fb=b<0?0:b>1?1:b;
        fr*=LN1; fg*=LN1; fb*=LN1;
        const r0=fr|0, g0=fg|0, b0=fb|0;
        const r1=r0<LN1?r0+1:r0, g1=g0<LN1?g0+1:g0, b1=b0<LN1?b0+1:b0;
        const dr=fr-r0, dg=fg-g0, db=fb-b0, mr=1-dr, mg=1-dg, mb=1-db;
        const w000=mr*mg*mb, w100=dr*mg*mb, w010=mr*dg*mb, w110=dr*dg*mb,
              w001=mr*mg*db, w101=dr*mg*db, w011=mr*dg*db, w111=dr*dg*db;
        const o000=(b0*LNN+g0*LN+r0)*3, o100=(b0*LNN+g0*LN+r1)*3,
              o010=(b0*LNN+g1*LN+r0)*3, o110=(b0*LNN+g1*LN+r1)*3,
              o001=(b1*LNN+g0*LN+r0)*3, o101=(b1*LNN+g0*LN+r1)*3,
              o011=(b1*LNN+g1*LN+r0)*3, o111=(b1*LNN+g1*LN+r1)*3;
        const lr=LD[o000]*w000+LD[o100]*w100+LD[o010]*w010+LD[o110]*w110+LD[o001]*w001+LD[o101]*w101+LD[o011]*w011+LD[o111]*w111;
        const lg=LD[o000+1]*w000+LD[o100+1]*w100+LD[o010+1]*w010+LD[o110+1]*w110+LD[o001+1]*w001+LD[o101+1]*w101+LD[o011+1]*w011+LD[o111+1]*w111;
        const lb=LD[o000+2]*w000+LD[o100+2]*w100+LD[o010+2]*w010+LD[o110+2]*w110+LD[o001+2]*w001+LD[o101+2]*w101+LD[o011+2]*w011+LD[o111+2]*w111;

      }

      // 2. film colour matrix

      let ng=r*mx[3]+g*mx[4]+b*mx[5];
      let nb=r*mx[6]+g*mx[7]+b*mx[8];
      r=nr;g=ng;b=nb;
      let lum=0.299*r+0.587*g+0.114*b;
      // 3. saturation
      r=lum+(r-lum)*O.sat; g=lum+(g-lum)*O.sat; b=lum+(b-lum)*O.sat;
      // 4. split-tone (shadows / highlights)
      if(O.split){
        const sF=lum<0.5?(0.5-lum)*2:0, hF=lum>0.5?(lum-0.5)*2:0, sp=O.split;

      }
      // 5. contrast (pivot 0.5)
      r=(r-0.5)*O.con+0.5; g=(g-0.5)*O.con+0.5; b=(b-0.5)*O.con+0.5;

      if(O.sh&&lum<0.55){const f=(0.55-lum)/0.55*O.sh*0.028;r-=f;g-=f;b-=f;}
      // 7. matte / fade
      if(O.lift){const L=O.lift;r=L+r*(1-L);g=L+g*(1-L);b=L+b*(1-L);}
      // 8. mono + toning (blended toward colour by preset intensity)

      d[p+1]=g<0?0:g>1?255:g*255;
      d[p+2]=b<0?0:b>1?255:b*255;
    }
  }
  // 10. optical glow (halation + bloom), then 11. film grain — both spatial, so post-pass
  if(O.sharp||O.clar)applyDetail(d,w,h,O);
  if(O.lens)applyLens(d,w,h,O);
  if(O.hal||O.bloom)applyGlow(d,w,h,O);
  if(O.grain&&!(opts&&opts.noGrain))applyGrain(d,w,h,O,!!P.mono);
  ctx.putImageData(id,0,0);
  if(A&&A.frame>0)applyFrame(canvas,ctx,A);
}
// Border: the canvas size (final format) never changes. The photo is shrunk uniformly (ratio kept)
// until its tightest side leaves a margin of t; the rest is filled with the border colour.
const FRAME_T=[0,.025,.05,.09], FRAME_LABEL=['Aucune','Fine','Moyenne','Épaisse'];
function applyFrame(canvas,ctx,A){
  const w=canvas.width,h=canvas.height,t=FRAME_T[A.frame|0]*Math.max(w,h);

  const tmp=document.createElement('canvas');tmp.width=w;tmp.height=h;tmp.getContext('2d').drawImage(canvas,0,0);

// Separable box blur on a small float buffer (clamped edges), in place.
function boxBlur(a,w,h,rad,passes){

      for(let x=0;x<w;x++)a[o+x]=t[x];}
    for(let x=0;x<w;x++){let s=0;

// Detail: sharpness = unsharp mask with a tiny radius (fine edges);
// clarity = unsharp mask with a wide radius, weighted to midtones (local contrast).
// Both work on luminance only so colours don't shift. Radii scale with frame size.
function applyDetail(d,w,h,O){
  const n=w*h, Y=new Float32Array(n);

  if(O.clar){C=Float32Array.from(Y);boxBlur(C,w,h,Math.max(4,Math.round(m/60)),3);}
  const sa=O.sharp*1.4, ca=O.clar*0.9;

// Vintage lens softness: a light diffusion (blurred copy mixed back in) that grows toward the

    let fy=(y+0.5)/s-0.5;fy=fy<0?0:fy>sh-1?sh-1:fy;const y0=fy|0,y1=y0<sh-1?y0+1:y0,dy=fy-y0;

      let fx=(x+0.5)/s-0.5;fx=fx<0?0:fx>sw-1?sw-1:fx;const x0=fx|0,x1=x0<sw-1?x0+1:x0,dx=fx-x0;
      const i00=y0*sw+x0,i10=y0*sw+x1,i01=y1*sw+x0,i11=y1*sw+x1,
            w00=(1-dx)*(1-dy),w10=dx*(1-dy),w01=(1-dx)*dy,w11=dx*dy;

      d[p+1]+=((G[i00]*w00+G[i10]*w10+G[i01]*w01+G[i11]*w11)-d[p+1])*m;
      d[p+2]+=((B[i00]*w00+B[i10]*w10+B[i01]*w01+B[i11]*w11)-d[p+2])*m;

// Halation (red-orange glow bleeding round highlights, as light bounces off the film base)
// and bloom (soft white-ish diffusion of the highlights). Computed on a ~384px buffer so
// the glow scales with the frame (preview, thumbnails and export look the same) while
// staying fine enough to hug the actual highlight edges instead of blobbing over them.
function applyGlow(d,w,h,O){
  const s=Math.max(1,Math.max(w,h)/384), sw=Math.ceil(w/s), sh=Math.ceil(h/s), n=sw*sh;
  const H=new Float32Array(n), R=new Float32Array(n), G=new Float32Array(n), B=new Float32Array(n), C=new Float32Array(n);
  for(let y=0,p=0;y<h;y++){const row=((y/s)|0)*sw;

      const r=d[p]/255,g=d[p+1]/255,b=d[p+2]/255, l=0.299*r+0.587*g+0.114*b, i=row+((x/s)|0);

    for(let x=0;x<w;x++,p+=4){
      let fx=(x+0.5)/s-0.5;fx=fx<0?0:fx>sw-1?sw-1:fx;const x0=fx|0,x1=x0<sw-1?x0+1:x0,dx=fx-x0;
      const i00=y0*sw+x0,i10=y0*sw+x1,i01=y1*sw+x0,i11=y1*sw+x1,
            w00=(1-dx)*(1-dy),w10=dx*(1-dy),w01=(1-dx)*dy,w11=dx*dy;
      let ar=0,ag=0,ab=0;
      if(hk){const hv=(H[i00]*w00+H[i10]*w10+H[i01]*w01+H[i11]*w11)*hk;ar+=hv;ag+=hv*0.38;ab+=hv*0.1;}
      if(bk){ar+=(R[i00]*w00+R[i10]*w10+R[i01]*w01+R[i11]*w11)*bk;
             ag+=(G[i00]*w00+G[i10]*w10+G[i01]*w01+G[i11]*w11)*bk;
             ab+=(B[i00]*w00+B[i10]*w10+B[i01]*w01+B[i11]*w11)*bk;}
      // screen blend: glows lift darks around highlights without clipping them further
      const r=d[p]/255,g=d[p+1]/255,b=d[p+2]/255;
      ar=ar>1?1:ar;ag=ag>1?1:ag;ab=ab>1?1:ab;
      d[p]=(1-(1-r)*(1-ar))*255;d[p+1]=(1-(1-g)*(1-ag))*255;d[p+2]=(1-(1-b)*(1-ab))*255;

}
// Film grain: seeded value noise (stable between repaints), cell size relative to the frame,
// strongest in the midtones like real silver grain, with a touch of chroma on colour stocks.
function ghash(x,y,s){let h=Math.imul(x,374761393)+Math.imul(y,668265263)+Math.imul(s,1442695041)|0;
  h=Math.imul(h^(h>>>13),1274126177);h^=h>>>16;return (h&0xffff)/65535-0.5;}
function vnoise(fx,fy,s){const x0=Math.floor(fx),y0=Math.floor(fy),dx=fx-x0,dy=fy-y0;
  const a=ghash(x0,y0,s),b=ghash(x0+1,y0,s),c=ghash(x0,y0+1,s),e=ghash(x0+1,y0+1,s);
  return (a+(b-a)*dx)*(1-dy)+(c+(e-c)*dx)*dy;}
function applyGrain(d,w,h,O,mono){
  const cells=2600-1900*O.gSize, cell=Math.max(1,Math.max(w,h)/cells), inv=1/cell;

  for(let y=0,p=0;y<h;y++){const fy=y*inv;
    for(let x=0;x<w;x++,p+=4){const fx=x*inv;
      const r=d[p]/255,g=d[p+1]/255,b=d[p+2]/255, l=0.299*r+0.587*g+0.114*b;

let _db=null;
function idbOpen(){return new Promise((res,rej)=>{
  if(_db)return res(_db);
  const r=indexedDB.open('fotn',2);
  r.onupgradeneeded=()=>{const db=r.result;
    if(!db.objectStoreNames.contains('photos'))db.createObjectStore('photos',{keyPath:'id'});
    if(!db.objectStoreNames.contains('meta'))db.createObjectStore('meta');};   // out-of-line keys (FS handle, prefs)
  r.onsuccess=()=>{_db=r.result;res(_db);};
  r.onerror=()=>rej(r.error);
});}
function idbPut(item){return idbOpen().then(db=>new Promise((res,rej)=>{
  const t=db.transaction('photos','readwrite');t.objectStore('photos').put(item);
  t.oncomplete=()=>res();t.onerror=()=>rej(t.error);}));}
function idbDelete(id){return idbOpen().then(db=>new Promise((res,rej)=>{
  const t=db.transaction('photos','readwrite');t.objectStore('photos').delete(id);
  t.oncomplete=()=>res();t.onerror=()=>rej(t.error);}));}
function idbGetAll(){return idbOpen().then(db=>new Promise((res,rej)=>{
  const r=db.transaction('photos','readonly').objectStore('photos').getAll();
  r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error);}));}
function idbMetaSet(k,v){return idbOpen().then(db=>new Promise((res,rej)=>{
  const t=db.transaction('meta','readwrite');t.objectStore('meta').put(v,k);
  t.oncomplete=()=>res();t.onerror=()=>rej(t.error);}));}
function idbMetaGet(k){return idbOpen().then(db=>new Promise((res,rej)=>{
  const r=db.transaction('meta','readonly').objectStore('meta').get(k);
  r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);}));}
function idbMetaDel(k){return idbOpen().then(db=>new Promise((res,rej)=>{
  const t=db.transaction('meta','readwrite');t.objectStore('meta').delete(k);

// ---------- FOTN export folder (File System Access API — Android/desktop Chrome) ----------
// Desktop (souris) : Chrome refuse Téléchargements/Documents dans le sélecteur de dossier ("accès refusé")
// → on passe par un téléchargement classique, qui atterrit dans Téléchargements. Dossier FOTN = mobile seulement.
const IS_DESKTOP=!!(window.matchMedia&&matchMedia('(hover:hover) and (pointer:fine)').matches);
let _fotnDir=null;
async function fsVerify(h){                       // ensure readwrite permission (may prompt once/session)
  if(!h||!h.queryPermission)return true;
  const opt={mode:'readwrite'};
  if((await h.queryPermission(opt))==='granted')return true;
  try{return (await h.requestPermission(opt))==='granted';}catch(e){return false;}
}
// Returns the persisted FOTN dir handle (writable), or null. `interactive` allows prompting
// (must be called from a user gesture). On first use: pick a location → create/use a FOTN subfolder.
async function getFotnDir(interactive){
  if(!window.showDirectoryPicker)return null;      // unsupported (e.g. iOS Safari) → caller uses share/zip
  if(_fotnDir&&await fsVerify(_fotnDir))return _fotnDir;
  try{const saved=await idbMetaGet('fotnDir');
    if(saved){if(await fsVerify(saved)){_fotnDir=saved;return saved;} }}catch(e){}
  if(!interactive)return null;
  let parent;
  try{parent=await window.showDirectoryPicker({id:'fotnExport',mode:'readwrite',startIn:'pictures'});}
  catch(e){return null;}                           // user cancelled the picker
  let dir; try{dir=await parent.getDirectoryHandle('FOTN',{create:true});}catch(e){dir=parent;}
  _fotnDir=dir; try{await idbMetaSet('fotnDir',dir);}catch(e){}
  return dir;
}
function forgetFotnDir(){_fotnDir=null;return idbMetaDel('fotnDir').catch(()=>{});}
async function writeToDir(dir,name,blob){
  const fh=await dir.getFileHandle(name,{create:true});
  const w=await fh.createWritable();await w.write(blob);await w.close();
}

function photoCard(it){
  const c=el('div','pcard');c.tabIndex=0;c.dataset.id=it.id;c.setAttribute('role','button');c.setAttribute('aria-label','Ouvrir la photo');
  const img=el('img');img.alt='';img.loading='lazy';img.draggable=false;
  // ratio comes from the thumbnail's real pixels (matches the bitmap → no stretch); else natural
  if(it.tw&&it.th)img.style.aspectRatio=it.tw+'/'+it.th;
  if(it.thumb)img.src=it.thumb;
  c.appendChild(img);
  // selection checkbox (only visible while a selection is active)
  const chk=el('div','pcheck');chk.innerHTML=svgIcon(CHECK_ICON,18);c.appendChild(chk);
  if(selected.has(it.id))c.classList.add('sel');
  // Press and hold ~500ms → multi-select.
  c.addEventListener('pointerdown',e=>{
    if(e.button&&e.button!==0)return;
    // clear the flag as each new gesture starts, never leave a tap swallowed
    lpSuppress=false;
    if(selectMode)return;                       // while selecting, a tap just toggles the card
    lpX=e.clientX;lpY=e.clientY;lpDown=true;
    clearTimeout(lpTimer);
    lpTimer=setTimeout(()=>{
      if(!lpDown||selectMode)return;
      lpSuppress=true;                          // swallow the click that follows the release
      try{navigator.vibrate&&navigator.vibrate(8);}catch(e){}
      enterSelect(it.id);
    },500);
  });
  // moving before the hold completes = the user is scrolling (touch) → drop the timer
  c.addEventListener('pointermove',e=>{
    if(Math.abs(e.clientX-lpX)>10||Math.abs(e.clientY-lpY)>10)clearTimeout(lpTimer);
  });
  c.addEventListener('pointerup',()=>clearTimeout(lpTimer));
  c.addEventListener('pointercancel',()=>clearTimeout(lpTimer));
  c.addEventListener('contextmenu',e=>e.preventDefault());
  c.addEventListener('dragstart',e=>e.preventDefault());   // no native image drag
  c.onclick=e=>{
    if(lpSuppress){lpSuppress=false;e.preventDefault();return;}   // ignore the release-click after a hold
    if(selectMode){e.preventDefault();toggleSel(it,c);return;}     // in select mode → toggle
    openItem(it);
  };
  c.onkeydown=e=>{
    if(e.key==='Enter'||e.key===' '){e.preventDefault();if(selectMode)toggleSel(it,c);else openItem(it);return;}
  };
  return c;
}

async function exportBatch(items){
  // Acquire the FOTN folder FIRST (the picker/permission prompt needs the tap's activation, before any render).
  const fsa=!!window.showDirectoryPicker&&!IS_DESKTOP;
  let dir=null;
  if(fsa){dir=await getFotnDir(true);if(!dir){toast('Export annulé');return;}}
  const ov=showBusy('Préparation…');
  try{
    const rendered=[]; let failed=0;
    for(let i=0;i<items.length;i++){
      ov.set(`Rendu ${i+1}/${items.length}…`);ov.progress(.7*i/items.length);await nextFrame();
      const r=await renderItemToBlob(items[i],3200,1000+i);
      if(r&&r.blob)rendered.push(r); else failed++;
    }
    if(!rendered.length){toast('Export impossible');return;}
    // A) Android/desktop Chrome → write each JPEG straight into the FOTN folder.
    if(dir){
      let wrote=0;
      for(let i=0;i<rendered.length;i++){ov.set(`Enregistrement ${i+1}/${rendered.length}…`);ov.progress(.7+.3*i/rendered.length);
        try{await writeToDir(dir,rendered[i].name,rendered[i].blob);wrote++;}catch(e){failed++;}}
      exitSelect();
      toast((wrote>1?`${wrote} photos`:'Photo')+' → dossier FOTN'+(failed?` (${failed} échec)`:''));
      return;
    }
    // Desktop → un téléchargement par photo (dans Téléchargements)
    if(IS_DESKTOP){
      for(let i=0;i<rendered.length;i++){ov.set(`Téléchargement ${i+1}/${rendered.length}…`);ov.progress(.7+.3*i/rendered.length);
        downloadBlob(rendered[i].blob,rendered[i].name);await new Promise(r=>setTimeout(r,350));}
      exitSelect();
      toast((rendered.length>1?`${rendered.length} photos`:'Photo')+' → Téléchargements'+(failed?` (${failed} échec)`:''));
      return;
    }
    // B) iOS (no folder API): single photo → share/download the JPEG…
    if(rendered.length===1){
      const f=new File([rendered[0].blob],rendered[0].name,{type:'image/jpeg'});
      if(navigator.canShare&&navigator.canShare({files:[f]})){
        try{await navigator.share({files:[f],title:'FOTN'});exitSelect();return;}
        catch(e){if(e&&e.name==='AbortError')return;}
      }
      downloadBlob(rendered[0].blob,f.name);exitSelect();toast('Photo exportée');return;
    }
    // …multiple photos → ONE zip whose contents live in a FOTN/ folder (unzips to a FOTN folder).
    ov.set('Compression…');ov.progress(.85);await nextFrame();
    const entries=rendered.map(r=>({name:'FOTN/'+r.name, blob:r.blob}));
    const zip=await makeZip(entries), zname='FOTN_'+stampCompact()+'.zip';
    const zfile=new File([zip],zname,{type:'application/zip'});
    const done=()=>{exitSelect();toast(entries.length+' photos → dossier FOTN'+(failed?` (${failed} échec)`:''));};
    if(navigator.canShare&&navigator.canShare({files:[zfile]})){
      try{await navigator.share({files:[zfile],title:'FOTN'});done();return;}
      catch(e){if(e&&e.name==='AbortError')return;}
    }
    downloadBlob(zip,zname);done();
  }catch(e){toast('Export impossible');}
  finally{hideBusy(ov);}
}

let edMode='presets';        // 'presets' | 'adjust'
let toolK=null, toolEntry=0;  // adjustment currently edited (single-slider), and its value on entry

function renderDock(){renderRail();renderMenu();}
function renderRail(){
  const rail=$('#edRail');if(!rail)return;rail.className='ed-rail';rail.innerHTML='';
  if(cropMode){rail.classList.add('cropedit');buildCropControls(rail);return;}
  if(toolK){rail.classList.add('editing');buildToolSlider(rail);return;}
  rail.classList.add('scroller');
  if(edMode==='presets')buildPresetRail(rail);else buildToolChips(rail);
}
function renderMenu(){
  const menu=$('#edMenu');if(!menu)return;menu.className='ed-menu';menu.innerHTML='';
  if(cropMode){menu.classList.add('editing');buildCropMenu(menu);return;}
  if(toolK){menu.classList.add('editing');buildToolMenu(menu);return;}
  [['presets','Filtres'],['adjust','Réglages']].forEach(([m,label])=>{
    const b=el('button','m');b.setAttribute('role','tab');
    b.innerHTML=svgIcon(TAB_ICON[m],22)+'<span>'+label+'</span>';
    if(edMode===m){b.classList.add('on');b.setAttribute('aria-selected','true');}
    b.onclick=()=>{if(edMode!==m){edMode=m;toolK=null;renderDock();}};
    menu.appendChild(b);
  });
}

// — presets rail: "Original" + one thumbnail per look, previewed on the current photo —
const presetByI=i=>(i<0?ORIGINAL:RECIPES[i]);
function buildPresetRail(rail){
  const frag=document.createDocumentFragment();
  RAIL.forEach(p=>{
    const b=el('button','pchip');b.dataset.i=p._i;
    b.setAttribute('role','option');b.setAttribute('aria-label',p.name||'');
    const cv=el('canvas');cv.width=112;cv.height=112;cv.setAttribute('aria-hidden','true');
    const sp=el('span');sp.textContent=p.name||'';
    b.appendChild(cv);b.appendChild(sp);
    b.onclick=()=>selectPreset(p);
    frag.appendChild(b);
  });
  rail.appendChild(frag);
  markPresetRail();paintPresetRail();
}
let stripScheduled=false;
function paintPresetRail(){
  if(stripScheduled)return;stripScheduled=true;
  requestAnimationFrame(()=>{stripScheduled=false;
    const src=userImg||baseImg;
    if(!src||!(src.naturalWidth||src.width))return;
    document.querySelectorAll('#edRail .pchip canvas').forEach(cv=>{
      const p=presetByI(+cv.parentNode.dataset.i);if(p)renderRecipe(src,p,NEUTRAL,cv,112,112);
    });
  });
}
function markPresetRail(){
  document.querySelectorAll('#edRail .pchip').forEach(c=>{
    const on=cur&&+c.dataset.i===cur._i;
    c.classList.toggle('on',on);c.setAttribute('aria-selected',on?'true':'false');
    if(on)c.scrollIntoView({inline:'center',block:'nearest'});
  });
}
// Switch preset inside the editor — keeps the user's manual adjustments.
function selectPreset(p){
  if(!p)return;cur=p;
  $('#edName').textContent=p.name||'';
  markPresetRail();paint();
}

// — réglages rail: a Crop entry + one chip per adjustment (icon + name only) —
const FRAME_ICON='M3 3H21V21H3ZM5 5V19H19V5ZM8 8H16V16H8Z';
const CROP_ICON='M15 17V19H6C5.44772 19 5 18.5523 5 18V7H2V5H5V2H7V17H15ZM17 22V7H9V5H18C18.5523 5 19 5.44772 19 6V17H22V19H19V22H17Z';
function buildToolChips(rail){
  const cb=el('button','tchip'+(cropN?' act':''));cb.setAttribute('aria-label','Recadrer');
  const ci=el('span','tico');ci.innerHTML=svgIcon(CROP_ICON,22);
  const cl=el('span','tlabel');cl.textContent='Recadrer';
  cb.appendChild(ci);cb.appendChild(cl);
  cb.onclick=enterCrop;
  rail.appendChild(cb);
  const fb=el('button','tchip'+(vals.frame>0?' act':''));fb.setAttribute('aria-label','Bordure');
  const fi=el('span','tico');fi.innerHTML=svgIcon(FRAME_ICON,22);
  const fl=el('span','tlabel');fl.textContent='Bordure';
  fb.appendChild(fi);fb.appendChild(fl);fb.onclick=()=>openTool('frame');
  rail.appendChild(fb);
  ADJ.forEach(a=>{
    const active=vals[a.k]!==adjDef(a);
    const b=el('button','tchip'+(active?' act':''));b.setAttribute('aria-label',a.label);
    const ico=el('span','tico');if(ADJ_ICON[a.k])ico.innerHTML=svgIcon(ADJ_ICON[a.k],22);
    const lab=el('span','tlabel');lab.textContent=a.label;
    b.appendChild(ico);b.appendChild(lab);
    b.onclick=()=>openTool(a.k);
    rail.appendChild(b);
  });
}

// — single-adjustment editing: one slider with cancel / confirm —
let frameEntry=null;
function openTool(k){toolK=k;toolEntry=vals[k];if(k==='frame')frameEntry={f:vals.frame,c:vals.frameC};renderDock();}
function confirmTool(){toolK=null;edMode='adjust';renderDock();}
function cancelTool(){if(toolK==='frame'&&frameEntry){vals.frame=frameEntry.f;vals.frameC=frameEntry.c;paint();}
  else if(toolK!=null){vals[toolK]=toolEntry;paint();}toolK=null;edMode='adjust';renderDock();}
function buildToolSlider(rail){
  if(toolK==='frame'){buildFramePanel(rail);return;}
  const a=SLIDER_BY_K[toolK];
  const val=el('div','tool-val');val.id='toolVal';
  const range=el('div','range');
  range.innerHTML=`<div class="track"></div><div class="midmark"></div><div class="fill" id="toolFill"></div>
    <input type="range" min="${a.min}" max="${a.max}" step="${a.step}" id="toolInput" aria-label="${a.label}">`;
  rail.appendChild(val);rail.appendChild(range);
  const inp=range.querySelector('input');inp.value=vals[toolK];
  updToolSlider();
  const onInput =()=>{vals[toolK]=parseFloat(inp.value);updToolSlider();paintLook(true);};   // draft while dragging
  const onCommit=()=>{vals[toolK]=parseFloat(inp.value);updToolSlider();paintLook(false);};  // full on release
  inp.addEventListener('input',onInput);    // keyboard (arrows) still works
  inp.addEventListener('change',onCommit);
  attachRelativeSlider(inp,onInput,onCommit);
}
// Border panel: thickness steps + colour (black / white / custom picker, with the screen eyedropper when available)
function buildFramePanel(rail){
  rail.classList.add('framepanel');
  const rowT=el('div','frame-row'), rowC=el('div','frame-row');
  const mark=()=>{
    rowT.querySelectorAll('button').forEach((b,i)=>b.classList.toggle('on',i===(vals.frame|0)));
    const c=(vals.frameC||'#000000').toLowerCase();
    rowC.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.c===c||(b.dataset.c==='custom'&&c!=='#000000'&&c!=='#ffffff')));
    cust.style.background=(c!=='#000000'&&c!=='#ffffff')?c:'';
  };
  FRAME_LABEL.forEach((l,i)=>{const b=el('button','fbtn');b.textContent=l;
    b.onclick=()=>{vals.frame=i;mark();paintLook(false);};rowT.appendChild(b);});
  const setC=(c,draft)=>{vals.frameC=c;if(!(vals.frame>0))vals.frame=2;mark();paintLook(!!draft);rowT.querySelectorAll('button').forEach((b,i)=>b.classList.toggle('on',i===(vals.frame|0)));};
  [['Noir','#000000'],['Blanc','#ffffff']].forEach(([l,c])=>{const b=el('button','fbtn');b.dataset.c=c;
    b.innerHTML='<i style="background:'+c+'"></i>'+l;b.onclick=()=>setC(c);rowC.appendChild(b);});
  const cust=el('button','fbtn');cust.dataset.c='custom';cust.innerHTML='<i class="rainbow"></i>Perso';
  const inp=document.createElement('input');inp.type='color';inp.value=/^#[0-9a-f]{6}$/i.test(vals.frameC)?vals.frameC:'#000000';
  inp.className='frame-picker';inp.setAttribute('aria-label','Couleur de la bordure');
  inp.addEventListener('input',()=>setC(inp.value,true));
  inp.addEventListener('change',()=>setC(inp.value,false));
  cust.onclick=()=>inp.click();
  rowC.appendChild(cust);rowC.appendChild(inp);
  if(window.EyeDropper){const p=el('button','fbtn');p.textContent='Pipette';p.setAttribute('aria-label','Prélever une couleur à l\u2019écran');
    p.onclick=async()=>{try{const r=await new EyeDropper().open();inp.value=r.sRGBHex;setC(r.sRGBHex);}catch(_){}};rowC.appendChild(p);}
  rail.appendChild(rowT);rail.appendChild(rowC);mark();
}
// VSCO-style RELATIVE dragging: touching anywhere keeps the current value; only the finger's
// horizontal movement changes it (delta), so there's no jump-to-touch on the first contact.
function attachRelativeSlider(inp,onInput,onCommit){
  const mn=parseFloat(inp.min), mx=parseFloat(inp.max), st=parseFloat(inp.step)||1;
  inp.style.touchAction='none';
  let dragging=false, startX=0, startVal=0;

function autoDeskew(img){

  let w=360,h=Math.round(360*IH/IW); if(IH>IW){h=360;w=Math.round(360*IW/IH);}
  w=Math.max(8,w);h=Math.max(8,h);
  const cv=document.createElement('canvas');cv.width=w;cv.height=h;
  const ctx=cv.getContext('2d',{willReadFrequently:true});ctx.drawImage(img,0,0,w,h);
  let d;try{d=ctx.getImageData(0,0,w,h).data;}catch(e){return 0;}
  const g=i=>{const o=i*4;return 0.299*d[o]+0.587*d[o+1]+0.114*d[o+2];};
  let sumW=0,sumA=0;
  for(let y=1;y<h-1;y++)for(let x=1;x<w-1;x++){
    const i=y*w+x, gx=g(i+1)-g(i-1), gy=g(i+w)-g(i-w), mag=Math.hypot(gx,gy);
    if(mag<20)continue;
    let a=Math.atan2(gy,gx)*180/Math.PI; a=((a%90)+90)%90; const dev=a<=45?a:a-90;
    if(Math.abs(dev)>25)continue;                 // only near-axis lines vote
    const wgt=mag*mag; sumW+=wgt; sumA+=wgt*dev;
  }
  if(sumW<=0)return 0;
  return Math.max(-30,Math.min(30, -(sumA/sumW)*0.78));   // 0.78 calibration from tests
}
// turn a normalised crop {x,y,w,h,rot(deg)} into a source-px region {sx,sy,sw,sh,rot(rad)};
// when rotated, auto-zoom + clamp so the tilted crop always stays inside the image (no empty corners)
function cropRegion(cn,IW,IH){
  const rot=(cn.rot||0)*Math.PI/180;
  let cx=(cn.x+cn.w/2)*IW, cy=(cn.y+cn.h/2)*IH, hw=cn.w*IW/2, hh=cn.h*IH/2;
  if(rot){
    const c=Math.abs(Math.cos(rot)), s=Math.abs(Math.sin(rot));
    let bx=hw*c+hh*s, by=hw*s+hh*c;                  // bounding half-extents of the tilted rect
    const k=Math.min(1,(IW/2)/bx,(IH/2)/by);          // shrink to fit
    hw*=k;hh*=k;bx*=k;by*=k;
    cx=Math.min(Math.max(cx,bx),IW-bx);               // keep the tilted rect inside the image
    cy=Math.min(Math.max(cy,by),IH-by);
  }else{
    hw=Math.min(hw,IW/2);hh=Math.min(hh,IH/2);
    cx=Math.min(Math.max(cx,hw),IW-hw);cy=Math.min(Math.max(cy,hh),IH-hh);
  }
  return {sx:cx-hw,sy:cy-hh,sw:2*hw,sh:2*hh,rot};
}
// normalised aspect (w/h in 0..1 image space) for an output ratio R = outW/outH
function arnFor(r){if(r==null)return null;const [IW,IH]=cropSrcWH();const R=(r==='orig')?(IW/IH):r;return R*IH/IW;}
// displayed image rect inside #preview (object-fit: contain)
// while a transform is active the preview shows the transformed RESULT, so the box lives in result space
function tiltInfo(){const [IW,IH]=cropSrcWH();return {IW,IH,reg:cropRegion(cropDraft,IW,IH)};}
function boxState(){return geoActive(cropDraft)?tbox:cropDraft;}
function setBoxState(b){if(geoActive(cropDraft))tbox={...tbox,...b};else cropDraft={...cropDraft,...b};}
// aspect (w/h) of the box in its own normalised space, for the ratio chosen in the dock
function curArn(){
  if(cropARR==null)return null;
  if(geoActive(cropDraft)){const r=tiltInfo().reg;return cropARR*r.sh/r.sw;}
  const [IW,IH]=cropSrcWH();return cropARR*IH/IW;
}
// move the sub-box drawn on the transformed result back into the crop (exact: same rotation, shifted centre)
function commitTilt(){
  if(!geoActive(cropDraft))return;
  const t=tbox;if(t.w>=0.999&&t.h>=0.999&&t.x<=0.001&&t.y<=0.001)return;
  const {IW,IH,reg}=tiltInfo();
  const cx=reg.sx+reg.sw/2, cy=reg.sy+reg.sh/2, c=Math.cos(reg.rot), s=Math.sin(reg.rot);
  const ox=(t.x+t.w/2-0.5)*reg.sw, oy=(t.y+t.h/2-0.5)*reg.sh;
  const ncx=cx+c*ox+s*oy, ncy=cy-s*ox+c*oy, hw=reg.sw*t.w/2, hh=reg.sh*t.h/2;
  cropDraft={...cropDraft,x:(ncx-hw)/IW,y:(ncy-hh)/IH,w:2*hw/IW,h:2*hh/IH};
  tbox={x:0,y:0,w:1,h:1};
  if(cropARR!=null)setCropRatio(cropARkey);
  paintPreview();requestAnimationFrame(()=>requestAnimationFrame(layoutCropBox));
}
function imgDispRect(){
  const pv=$('#preview').getBoundingClientRect();
  const [IW,IH]=geoActive(cropDraft)?(r=>[r.sw,r.sh])(tiltInfo().reg):cropSrcWH();
  const PAD=30;                              // room around the full-frame box for the corner/edge handles
  const aw=Math.max(1,pv.width-2*PAD),ah=Math.max(1,pv.height-2*PAD);
  const s=Math.min(aw/IW,ah/IH),dW=IW*s,dH=IH*s;
  return {left:(pv.width-dW)/2,top:(pv.height-dH)/2,w:dW,h:dH};
}
function layoutCropBox(){
  if(!cropDraft)return;const R=imgDispRect(),c=boxState(),b=$('#cropBox');
  b.style.left=(R.left+c.x*R.w)+'px';b.style.top=(R.top+c.y*R.h)+'px';
  b.style.width=(c.w*R.w)+'px';b.style.height=(c.h*R.h)+'px';
}
