<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F9F4EE">
<title>fotn</title>
<meta name="description" content="fotn — presets photo inspirés des pellicules argentiques classiques, à appliquer et régler sur vos photos.">
<link rel="icon" type="image/svg+xml" href="favicon.svg?v=11">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png?v=11">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=11">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="fotn">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anaheim:wght@400;500;600;700;800&display=swap">
<style>
:root{
  /* Monochrome LIGHT — cream / black / grey (colour lives only in the photos) */
  --bg:#F9F4EE; --bg2:#f7f7f7; --panel:#f0f0f0; --panel2:#e8e8e8;
  --line:#e4e4e4; --line2:#d2d2d2;
  --txt:#292929; --txt2:#595959; --txt3:#8c8c8c;
  --accent:#292929; --accent2:#2c2c2c;   /* "accent" = the darkest neutral, for active/primary */
  --pos:#141414; --neg:#9a9a9a;
  --ink:#F9F4EE;            /* text/icon colour on the dark accent */
  /* radius scale */
  --r-lg:16px;             /* cards, sheets */
  --r-md:11px;             /* inputs, buttons, panels, controls */
  --r-sm:7px;              /* badges, inner segments, small marks */
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  background:var(--bg); color:var(--txt);
  font-family:"Anaheim","Helvetica Neue",Helvetica,Arial,sans-serif;
  font-size:15px; line-height:1.45; -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
button{font-family:inherit;color:inherit;cursor:pointer;border:none;background:none}
input{font-family:inherit}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:8px}
::-webkit-scrollbar-track{background:transparent}

/* ---------- HEADER ---------- */
.app{position:relative;z-index:1;max-width:1320px;margin:0 auto;padding:0 16px}
header.top{
  padding:calc(var(--safe-t) + 14px) 0 10px;   /* top safe-area spacing; no background (let the backdrop show) */
}
.count{margin-left:auto;font-size:11px;color:var(--txt3);text-align:right;flex:none}
.count b{color:var(--accent);font-weight:700}

/* selection bar — 61px tall, no layout jump when it appears */
.selbar{min-height:61px;display:flex;align-items:center;gap:10px;animation:selbarIn .16s ease}
.selbar[hidden]{display:none}   /* class rule would otherwise beat the UA [hidden] */
@keyframes selbarIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.sbtn{flex:none;padding:8px 14px;border-radius:999px;font-size:13px;font-weight:600;white-space:nowrap;
  background:var(--panel);border:1px solid var(--line);color:var(--txt);transition:.15s}
.sbtn:hover{border-color:var(--line2)}
.sbtn.ico{padding:0;width:38px;height:38px;display:grid;place-items:center;border-radius:50%}
/* primary = the dark accent, matching the dark FAB that carries the same action */
.sbtn.prim{background:var(--accent);border-color:var(--accent);color:var(--ink)}
.sbtn.prim:hover{filter:brightness(1.15)}
.sbtn[aria-disabled="true"]{opacity:.4;pointer-events:none}
.sbtn[hidden]{display:none}
.sbtn.act{display:inline-flex;align-items:center;gap:7px}
.selcount b{font-weight:700;font-variant-numeric:tabular-nums}
/* On a phone the bar is tight: the actions collapse to their icon (aria-label carries the
   name) and the count keeps only its number. Everything spells itself out from 560px up. */
@media(max-width:559px){
  .sbtn.act .lbl,.selcount .lbl{display:none}
  .sbtn.act{padding:0;width:38px;height:38px;justify-content:center;border-radius:50%}
}
/* the count sits on the dithered backdrop → give it a cream pill so it stays readable */
.selcount{flex:0 1 auto;min-width:0;margin-right:auto;padding:7px 12px;border-radius:999px;
  background:rgba(249,244,238,.88);font-size:13px;font-weight:600;color:var(--txt);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media(max-width:420px){.sbtn{padding:8px 11px;font-size:12px}.selcount{font-size:12px;padding:7px 10px}}

.toolbar{display:flex;align-items:center;gap:10px;padding-bottom:12px}
.filters{display:flex;gap:8px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none;-ms-overflow-style:none}
.filters::-webkit-scrollbar{display:none}
.chip{
  flex:none;padding:7px 13px;border-radius:999px;font-size:13px;white-space:nowrap;
  background:var(--panel);border:1px solid var(--line);color:var(--txt2);transition:.15s;
}
.chip:hover{border-color:var(--line2)}
.chip.on{background:var(--txt);color:var(--ink);border-color:var(--txt);font-weight:600}

/* ---------- HOME: PHOTO LIBRARY (masonry, 3 columns) ---------- */
.gallery{padding:6px 0 calc(var(--safe-b) + 96px);column-count:3;column-gap:8px}
@media(min-width:560px){.gallery{column-count:4;column-gap:10px}}
@media(min-width:880px){.gallery{column-count:6}}
.pcard{position:relative;display:block;width:100%;margin:0 0 8px;overflow:hidden;cursor:pointer;background:var(--panel);
  break-inside:avoid;-webkit-column-break-inside:avoid;-webkit-touch-callout:none;user-select:none;
  transition:opacity .15s,transform .15s}   /* no border, no radius */
.pcard:hover{transform:translateY(-2px)}
.pcard:active{opacity:.85}
.pcard img{width:100%;height:auto;display:block;pointer-events:none}   /* natural ratio, no crop, no radius */
/* long-press → multi-select mode (checkbox per card) */
.pcard .pcheck{position:absolute;top:8px;right:8px;z-index:2;width:26px;height:26px;border-radius:50%;
  display:none;place-items:center;color:#F9F4EE;background:rgba(0,0,0,.32);
  box-shadow:0 0 0 2px rgba(249,244,238,.92);transition:background .12s,box-shadow .12s}
.gallery.selecting .pcheck{display:grid;animation:pdelIn .14s ease}
.gallery.selecting .pcard{cursor:default}
.gallery.selecting .pcard:hover{transform:none}
@keyframes pdelIn{from{opacity:0}to{opacity:1}}
.pcard .pcheck svg{opacity:0;transition:opacity .1s}
.pcard.sel .pcheck{background:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.pcard.sel .pcheck svg{opacity:1}
.pcard.sel img{opacity:.8}
.pcard.sel{outline:3px solid var(--accent);outline-offset:-3px}

/* drag to reorder — the lifted copy follows the finger, the slot stays visible in the flow */
.pghost{position:fixed;left:0;top:0;z-index:200;pointer-events:none;will-change:transform;
  box-shadow:0 14px 34px rgba(0,0,0,.38);opacity:.96}
.pghost img{width:100%;height:100%;display:block;object-fit:cover}
.pcard.ghosted{opacity:.22;outline:2px dashed var(--line2);outline-offset:-2px}
.pcard.ghosted img{filter:grayscale(1)}
body.reordering{cursor:grabbing}
body.reordering .pcard{cursor:grabbing}
body.reordering .pcard:hover{transform:none}    /* no hover lift while rearranging */

/* while selecting, the two FABs swap their icon (Import→trash, Caméra→download) */
.fab .ic-sel{display:none}
body.selmode .fab .ic-def{display:none}
body.selmode .fab .ic-sel{display:block}
body.selmode .fab.dim{opacity:.4;pointer-events:none}   /* nothing selected → nothing to act on */

/* full-screen busy overlay (batch export progress) */
.busyov{position:fixed;inset:0;z-index:320;display:grid;place-items:center;padding:24px;
  background:rgba(249,244,238,.72);backdrop-filter:blur(4px);opacity:0;transition:opacity .18s}
.busyov.show{opacity:1}
.busybox{display:grid;justify-items:center;gap:14px}
.busyspin{width:34px;height:34px;border-radius:50%;border:3px solid var(--line2);border-top-color:var(--accent);
  animation:busyspin .8s linear infinite}
@keyframes busyspin{to{transform:rotate(360deg)}}
.busytxt{font-size:14px;font-weight:600;color:var(--txt)}

/* app-styled confirm dialog (no native modals) */
.cscrim{position:fixed;inset:0;z-index:300;display:grid;place-items:center;padding:24px;
  background:rgba(0,0,0,.45);backdrop-filter:blur(3px);opacity:0;transition:opacity .2s}
.cscrim.show{opacity:1}
.cbox{width:100%;max-width:320px;background:var(--bg);border-radius:var(--r-lg);
  padding:20px 18px 16px;box-shadow:0 24px 60px -20px rgba(0,0,0,.4);transform:translateY(8px);transition:transform .2s}
.cscrim.show .cbox{transform:none}
.cmsg{margin:0 0 16px;font-size:15px;line-height:1.45;color:var(--txt);text-align:center}
.crow{display:flex;gap:10px}
.cbtn{flex:1;padding:12px;border-radius:var(--r-md);font-size:14px;font-weight:600;
  background:var(--panel2);border:1px solid transparent;color:var(--txt);transition:filter .15s,background .15s}
.cbtn:hover{background:var(--line2)}
.cbtn.danger{background:var(--accent);border-color:var(--accent);color:var(--ink)}
.cbtn.danger:hover{background:var(--accent);filter:brightness(1.1)}

/* surimpression — aperçu de l'empilement entre deux prises */
.mxov{position:fixed;inset:0;z-index:300;display:grid;place-items:center;padding:20px;
  background:rgba(0,0,0,.62);backdrop-filter:blur(3px);opacity:0;transition:opacity .2s}
.mxov.show{opacity:1}
.mxov[hidden]{display:none}
.mxbox{width:100%;max-width:380px;max-height:100%;overflow:auto;background:var(--bg);border-radius:var(--r-lg);
  padding:14px;box-shadow:0 24px 60px -20px rgba(0,0,0,.4);transform:translateY(8px);transition:transform .2s}
.mxov.show .mxbox{transform:none}
.mxprev{display:block;width:100%;height:auto;max-height:46vh;object-fit:contain;background:#000;border-radius:var(--r-md)}
.mxstep{margin:12px 0 10px;font-size:13px;font-weight:600;color:var(--txt2);text-align:center}
.mxmodes{display:flex;gap:8px;overflow-x:auto;padding-bottom:12px;scrollbar-width:none}
.mxmodes[hidden]{display:none}   /* class rule would otherwise beat the UA [hidden] */
.mxmodes::-webkit-scrollbar{display:none}
.mxrow{display:flex;flex-wrap:wrap;gap:8px}
.mxrow .cbtn{flex:1 1 calc(50% - 4px);min-width:0}
/* opacity of the stacked layers */
.mxop{display:flex;align-items:center;gap:10px;padding-bottom:12px}
.mxop[hidden]{display:none}
.mxoplab{flex:none;font-size:12px;font-weight:600;color:var(--txt2)}
.mxopval{flex:none;min-width:28px;font-size:12px;font-weight:700;color:var(--txt);text-align:right;
  font-variant-numeric:tabular-nums}
.mxop input[type=range]{flex:1;min-width:0;-webkit-appearance:none;appearance:none;height:4px;border-radius:3px;
  background:var(--line2);outline-offset:6px}
/* the library strip you pick the layers from */
.mxpicks{display:flex;gap:8px;overflow-x:auto;padding-bottom:14px;scrollbar-width:none}
.mxpicks[hidden]{display:none}
.mxpicks::-webkit-scrollbar{display:none}
.mxpick{flex:none;position:relative;width:62px;height:62px;border-radius:var(--r-sm);overflow:hidden;
  border:2px solid transparent;background:var(--panel);padding:0;cursor:pointer}
.mxpick img{width:100%;height:100%;object-fit:cover;display:block}
.mxpick.on{border-color:var(--accent)}
.mxpick .mxord{position:absolute;right:3px;bottom:3px;min-width:16px;height:16px;border-radius:8px;
  display:none;place-items:center;background:var(--accent);color:var(--ink);font-size:10px;font-weight:700}
.mxpick.on .mxord{display:grid}
.mxpick[aria-disabled="true"]{opacity:.35}
.mxempty{padding:2px 0 14px;font-size:12px;color:var(--txt3);text-align:center}

/* in-app camera — tap-to-focus (+ lock) and a brightness preview before shooting */
.camov{position:fixed;inset:0;z-index:400;background:#000;opacity:0;pointer-events:none;transition:opacity .2s}
.camov.show{opacity:1;pointer-events:auto}
.camov[hidden]{display:none}
#camVideo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
#camVideo.mirror{transform:scaleX(-1)}
.camMask{position:absolute;left:0;width:100%;height:0;background:rgba(0,0,0,.55);pointer-events:none;
  transition:height .15s}
#camMaskTop{top:0;border-bottom:1px solid rgba(255,255,255,.5)}
#camMaskBot{bottom:0;border-top:1px solid rgba(255,255,255,.5)}
.camClose,.camLock,.camSwitch{position:absolute;top:calc(var(--safe-t) + 14px);color:#fff;background:rgba(0,0,0,.4);
  border:1px solid rgba(255,255,255,.25);transition:.15s}
.camClose{left:14px;width:40px;height:40px;border-radius:50%;display:grid;place-items:center}
.camSwitch{left:64px;width:40px;height:40px;border-radius:50%;display:grid;place-items:center}
.camLock{right:14px;display:flex;align-items:center;gap:6px;padding:9px 14px;border-radius:999px;font-size:13px;font-weight:600}
.camLock svg{flex:none}
.camLock.on{background:#F9F4EE;color:#292929;border-color:#F9F4EE}
.camLock[aria-disabled="true"]{opacity:.35;pointer-events:none}
.camFocus{position:absolute;left:-100px;top:-100px;width:64px;height:64px;margin:-32px 0 0 -32px;
  border:2px solid #fff;border-radius:8px;pointer-events:none;opacity:0;transition:opacity .15s}
.camFocus.show{opacity:1;animation:camFocusPulse .4s ease}
.camFocus.locked{border-color:#F9F4EE}
@keyframes camFocusPulse{from{transform:scale(1.35)}to{transform:scale(1)}}
.camBright{position:absolute;left:20px;right:20px;bottom:calc(var(--safe-b) + 112px);
  display:flex;align-items:center;gap:10px;color:#fff}
.camBright svg{flex:none;opacity:.85}
.camBright input[type=range]{flex:1;-webkit-appearance:none;appearance:none;height:4px;border-radius:3px;
  background:rgba(255,255,255,.35);outline-offset:8px}
.camBright input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;
  background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.camBright input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:#fff;border:none}
.camShutter{position:absolute;left:50%;bottom:calc(var(--safe-b) + 26px);transform:translateX(-50%);
  width:70px;height:70px;border-radius:50%;background:#fff;border:4px solid rgba(255,255,255,.55)}
.camShutter:active{transform:translateX(-50%) scale(.9)}

/* ---------- DETAIL / EDITOR ---------- */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(3px);opacity:0;
  pointer-events:none;transition:.25s;z-index:50}
.scrim.show{opacity:1;pointer-events:auto}
.editor{
  position:fixed;z-index:60;background:var(--bg2);
  display:flex;flex-direction:column;
  transition:transform .34s cubic-bezier(.2,.8,.2,1);
}
/* mobile: bottom sheet full */
.editor{left:0;right:0;bottom:0;top:0;transform:translateY(100%)}
.editor.open{transform:translateY(0)}
@media(min-width:880px){
  .editor{left:auto;top:0;bottom:0;width:520px;transform:translateX(100%);
    border-left:1px solid var(--line);box-shadow:-30px 0 60px -30px rgba(0,0,0,.6)}
  .editor.open{transform:translateX(0)}
}
.ed-head{display:flex;align-items:center;gap:8px;padding:calc(var(--safe-t) + 12px) 14px 12px;
  border-bottom:1px solid var(--line);flex:none}
.ed-head .x{position:relative;width:34px;height:34px;border-radius:var(--r-md);background:none;display:grid;place-items:center;flex:none;transition:background .15s}
.ed-head .x:hover{background:var(--panel2)}
.ed-head .x::before,.ed-head .hfav::before{content:"";position:absolute;inset:-5px}  /* ≥44px touch target */
.ed-head .t{min-width:0;flex:1}
.ed-head .t h2{margin:0;font-size:18px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ed-head .t span{font-size:11px;color:var(--txt3)}
.ed-head .hfav{position:relative;width:34px;height:34px;border-radius:var(--r-md);background:var(--panel2);display:grid;place-items:center;flex:none;transition:background .15s}
.ed-head .hfav:hover{background:var(--line2)}
.ed-head .hfav.on{color:var(--accent)}

/* preview fills the space above the dock — the photo is the hero */
.preview{position:relative;width:100%;background:var(--bg2);overflow:hidden;flex:1;min-height:0}
.preview canvas{width:100%;height:100%;object-fit:contain;display:block}

/* crop tool — adjustable box with rule-of-thirds (ratio/apply controls live in the dock) */
.crop{position:absolute;inset:0;z-index:6;touch-action:none}
.crop[hidden]{display:none}
.crop-box{position:absolute;box-sizing:border-box;border:1px solid rgba(249,244,238,.95);
  box-shadow:0 0 0 9999px rgba(0,0,0,.55);cursor:move}
.crop-box::before,.crop-box::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.32}
.crop-box::before{background:
  linear-gradient(90deg,transparent calc(33.33% - .5px),#F9F4EE calc(33.33% - .5px),#F9F4EE calc(33.33% + .5px),transparent calc(33.33% + .5px)),
  linear-gradient(90deg,transparent calc(66.66% - .5px),#F9F4EE calc(66.66% - .5px),#F9F4EE calc(66.66% + .5px),transparent calc(66.66% + .5px))}
.crop-box::after{background:
  linear-gradient(0deg,transparent calc(33.33% - .5px),#F9F4EE calc(33.33% - .5px),#F9F4EE calc(33.33% + .5px),transparent calc(33.33% + .5px)),
  linear-gradient(0deg,transparent calc(66.66% - .5px),#F9F4EE calc(66.66% - .5px),#F9F4EE calc(66.66% + .5px),transparent calc(66.66% + .5px))}
.crop-h{position:absolute;width:44px;height:44px;z-index:2;touch-action:none}   /* 44px = accessible min touch target */
.crop-h::before{content:"";position:absolute;width:16px;height:16px;border:2px solid #F9F4EE;border-radius:1px}
.crop-h.tl{left:-22px;top:-22px}.crop-h.tl::before{left:6px;top:6px;border-right:none;border-bottom:none}
.crop-h.tr{right:-22px;top:-22px}.crop-h.tr::before{right:6px;top:6px;border-left:none;border-bottom:none}
.crop-h.bl{left:-22px;bottom:-22px}.crop-h.bl::before{left:6px;bottom:6px;border-right:none;border-top:none}
.crop-h.br{right:-22px;bottom:-22px}.crop-h.br::before{right:6px;bottom:6px;border-left:none;border-top:none}
/* edge handles — drag any side with one finger; free-ratio only (ratio-locked keeps corner-only) */
.crop-h.edge::before{border:none;background:#F9F4EE;border-radius:2px}
.crop-h.t,.crop-h.b{left:50%;width:64px;height:28px;margin-left:-32px;cursor:ns-resize}
.crop-h.l,.crop-h.r{top:50%;width:28px;height:64px;margin-top:-32px;cursor:ew-resize}
.crop-h.t{top:-14px}.crop-h.b{bottom:-14px}
.crop-h.l{left:-14px}.crop-h.r{right:-14px}
.crop-h.t::before,.crop-h.b::before{left:50%;top:50%;width:26px;height:3px;transform:translate(-50%,-50%)}
.crop-h.l::before,.crop-h.r::before{left:50%;top:50%;width:3px;height:26px;transform:translate(-50%,-50%)}
.crop-box:not(.free) .crop-h.edge{display:none}   /* ratio locked: corners only, so the ratio can't be broken by mistake */
/* straighten: hide the box, show a full rule-of-thirds grid over the WYSIWYG result */
.crop.tilt .crop-box{display:none}
.crop-grid{position:absolute;inset:0;pointer-events:none;display:none;opacity:.4;
  background:
   linear-gradient(90deg,transparent calc(33.33% - .5px),#F9F4EE calc(33.33% - .5px),#F9F4EE calc(33.33% + .5px),transparent calc(33.33% + .5px)),
   linear-gradient(90deg,transparent calc(66.66% - .5px),#F9F4EE calc(66.66% - .5px),#F9F4EE calc(66.66% + .5px),transparent calc(66.66% + .5px)),
   linear-gradient(0deg,transparent calc(33.33% - .5px),#F9F4EE calc(33.33% - .5px),#F9F4EE calc(33.33% + .5px),transparent calc(33.33% + .5px)),
   linear-gradient(0deg,transparent calc(66.66% - .5px),#F9F4EE calc(66.66% - .5px),#F9F4EE calc(66.66% + .5px),transparent calc(66.66% + .5px))}
.crop.tilt .crop-grid{display:block}
/* single-adjustment slider (reused by the tool-edit view) */
.range{position:relative;height:26px;display:flex;align-items:center}
.range .track{position:absolute;left:0;right:0;height:4px;border-radius:3px;background:var(--line2)}
.range .midmark{position:absolute;top:50%;transform:translateY(-50%);width:1px;height:11px;background:var(--txt3);opacity:.6}
.range .fill{position:absolute;height:4px;border-radius:3px;background:var(--accent);opacity:.9}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;background:transparent;position:relative;z-index:2;margin:0;height:26px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;
  background:var(--accent);border:2px solid var(--bg);box-shadow:0 0 0 1px var(--line2),0 2px 8px rgba(0,0,0,.25);cursor:grab}
input[type=range]::-webkit-slider-thumb:active{cursor:grabbing;transform:scale(1.12)}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--accent);border:2px solid var(--bg)}

/* header action buttons (reset / export) */
.ed-head .hbtn{position:relative;width:34px;height:34px;border-radius:var(--r-md);background:none;
  display:grid;place-items:center;flex:none;color:var(--txt);transition:background .15s,filter .15s}
.ed-head .hbtn:hover{background:var(--panel2)}
.ed-head .hbtn::before{content:"";position:absolute;inset:-5px}   /* ≥44px touch target */
.ed-head .hbtn.exp.busy{opacity:.6;pointer-events:none}
.ed-head .hbtn.save{background:var(--accent);color:var(--ink)}        /* primary action */
.ed-head .hbtn.save:hover{background:var(--accent);filter:brightness(1.08)}
.ed-head .hbtn[hidden]{display:none}

/* ---------- EDITOR DOCK (VSCO-style): a rail above a two-tab menu ---------- */
.ed-dock{flex:none;background:var(--bg2);border-top:1px solid var(--line)}
.ed-rail{display:flex;align-items:center;min-height:80px;padding:7px 14px}
.ed-rail.scroller{overflow-x:auto;gap:11px;scrollbar-width:none;-ms-overflow-style:none}
.ed-rail.scroller::-webkit-scrollbar{display:none}
/* presets rail — thumbnail chips */
.pchip{flex:none;display:flex;flex-direction:column;align-items:center;gap:7px;width:60px;cursor:pointer;background:none;padding:0}
.pchip canvas{width:56px;height:56px;border-radius:var(--r-md);display:block;background:var(--panel);
  border:2px solid transparent;transition:border-color .15s,transform .15s}
.pchip:hover canvas{transform:translateY(-2px)}
.pchip.on canvas{border-color:var(--accent)}
.pchip:active canvas{transform:translateY(0) scale(.96)}
.pchip span{font-size:10px;line-height:1.2;color:var(--txt3);max-width:60px;text-align:center;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color .15s}
.pchip.on span{color:var(--accent);font-weight:600}
/* tools rail — labelled chips (show the live value when active) */
.tchip{flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  min-width:74px;height:60px;padding:0 13px;border-radius:var(--r-md);background:var(--panel);
  border:1px solid transparent;color:var(--txt2);cursor:pointer;transition:.15s}
.tchip:hover{color:var(--txt)}
/* dock ratio chips (crop) */
.rchip{flex:none;align-self:center;padding:9px 14px;border-radius:999px;font-size:12.5px;font-weight:600;
  white-space:nowrap;background:var(--panel);border:1px solid transparent;color:var(--txt2);cursor:pointer;transition:.15s}
.rchip:hover{color:var(--txt)}
.rchip.on{background:var(--accent);color:var(--ink);border-color:var(--accent)}
/* crop dock: ratio chips row + straighten slider row */
.ed-rail.cropedit{flex-direction:column;align-items:stretch;gap:9px;min-height:0;max-height:44vh;overflow-y:auto;padding:10px 14px}
.crop-auto{display:flex;justify-content:center;gap:10px;padding-top:2px}
.auto-btn svg{vertical-align:-3px;margin-right:5px}
.auto-btn{padding:8px 18px;border-radius:999px;font-size:12.5px;font-weight:600;
  background:var(--panel);border:1px solid transparent;color:var(--txt);transition:.15s}
.auto-btn:hover{color:var(--accent)}
.crop-chips{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none}
.crop-chips::-webkit-scrollbar{display:none}
.crop-straight{display:flex;align-items:center;gap:11px}
.crop-straight .range{flex:1}
.cs-lab{font-size:12px;font-weight:600;color:var(--txt2);white-space:nowrap}
.cs-val{font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--txt);min-width:38px;text-align:right}
.tchip .tico{display:grid;place-items:center;height:24px;color:var(--txt2);transition:color .15s}
.tchip .tlabel{font-size:12px;font-weight:600;white-space:nowrap;line-height:1.1}
.tchip.act{border-color:var(--accent)}
.tchip.act .tico{color:var(--accent)}
.tchip.act .tlabel{color:var(--accent)}
/* tool-edit — one full-width slider */
.ed-rail.editing{flex-direction:column;align-items:stretch;gap:11px;padding:16px 20px}
.tool-val{text-align:center;font-variant-numeric:tabular-nums;font-weight:700;font-size:16px;color:var(--txt)}
/* two-tab menu */
.ed-menu{display:flex;align-items:stretch;border-top:1px solid var(--line);padding-bottom:var(--safe-b)}
.ed-menu .m{flex:1;padding:11px 6px;background:none;font-size:12px;font-weight:600;letter-spacing:.2px;
  color:var(--txt3);transition:.15s;display:flex;flex-direction:column;align-items:center;gap:4px}
.ed-menu .m svg{display:block}
.ed-menu .m:hover{color:var(--txt2)}
.ed-menu .m.on{color:var(--accent)}
/* tool-edit menu = cancel · label · confirm */
.ed-menu.editing{align-items:center;padding:5px 8px;padding-bottom:calc(var(--safe-b) + 5px)}
.ed-menu .ticon{flex:none;width:60px;height:44px;display:grid;place-items:center;background:none;color:var(--txt)}
.ed-menu .ticon.ok{color:var(--accent)}
.ed-menu .tname{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;
  font-size:13px;font-weight:600;color:var(--accent)}
.ed-menu .tname svg{display:block}

.toast{position:fixed;bottom:calc(var(--safe-b) + 22px);left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--accent);color:var(--ink);padding:11px 18px;border-radius:var(--r-md);font-size:13px;font-weight:600;
  z-index:100;opacity:0;transition:.25s;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.brand{position:fixed;left:16px;bottom:calc(var(--safe-b) + 16px);z-index:2;height:22px;width:auto;pointer-events:none}

.fabs{position:fixed;right:16px;bottom:calc(var(--safe-b) + 16px);z-index:30;display:flex;flex-direction:column;align-items:center;gap:10px}
.fab{width:58px;height:58px;border-radius:50%;background:var(--accent);color:var(--ink);
  display:grid;place-items:center;box-shadow:0 8px 24px -6px rgba(0,0,0,.28);transition:transform .15s,filter .15s}
.fab:hover{transform:translateY(-2px);filter:brightness(1.06)}
.fab:active{transform:translateY(0)}
.fab[hidden]{display:none}
.fab.sec{background:var(--bg);color:var(--txt);box-shadow:0 6px 18px rgba(0,0,0,.18)}
.fab.sec:hover{background:var(--line2);filter:none}

/* keyboard focus — one consistent ring everywhere */
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:var(--r-sm)}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;
    transition-duration:.001ms!important;scroll-behavior:auto!important}
}
</style>

<script>
//// ---------- MATERIAL DESIGN ICONS (Apache 2.0) ----------
const MI={
  heart:'M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z',
  heartO:'M16.5 3c-1.74 0-3.41.81-4.5 2.09C10.91 3.81 9.24 3 7.5 3 4.42 3 2 5.42 2 8.5c0 3.78 3.4 6.86 8.55 11.54L12 21.35l1.45-1.32C18.6 15.36 22 12.28 22 8.5 22 5.42 19.58 3 16.5 3zm-4.4 15.55l-.1.1-.1-.1C7.14 14.24 4 11.39 4 8.5 4 6.5 5.5 5 7.5 5c1.54 0 3.04.99 3.57 2.36h1.87C13.46 5.99 14.96 5 16.5 5c2 0 3.5 1.5 3.5 3.5 0 2.89-3.14 5.74-7.9 10.05z',
  close:'M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z',
  add:'M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z',
  image:'M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z',
  download:'M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z',
};
// inline material svg
function svgIcon(path,size){return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="${path}"></path></svg>`;}
// favorite heart that swaps filled/outline by state
function heartSvg(on,size){return svgIcon(on?MI.heart:MI.heartO,size);}
function setHeart(btn,on){if(!btn)return;const p=btn.querySelector('path');if(p)p.setAttribute('d',on?MI.heart:MI.heartO);btn.setAttribute('aria-pressed',!!on);}

// Turn a container of role=radio buttons into a keyboard radiogroup:
// roving tabindex + arrow/Home/End navigation (selection follows focus).
function wireRadios(group){
  const radios=[...group.querySelectorAll('[role=radio]')];
  if(!radios.length)return;
  let ci=radios.findIndex(b=>b.getAttribute('aria-checked')==='true');
  if(ci<0)ci=0;
  radios.forEach((b,i)=>b.tabIndex=i===ci?0:-1);
  const rg=group.getAttribute('data-rg');
  group.onkeydown=e=>{
    const i=radios.indexOf(document.activeElement);if(i<0)return;
    let n=null;const k=e.key;
    if(k==='ArrowRight'||k==='ArrowDown')n=(i+1)%radios.length;
    else if(k==='ArrowLeft'||k==='ArrowUp')n=(i-1+radios.length)%radios.length;
    else if(k==='Home')n=0;else if(k==='End')n=radios.length-1;else return;
    e.preventDefault();
    const val=radios[n].getAttribute('data-rv');
    radios[n].click();                 // selects -> rebuilds the group(s)
    const sel=document.querySelector(`[data-rg="${rg}"] [data-rv="${val}"]`);
    if(sel)sel.focus();

function clamp(x,a,b){return x<a?a:x>b?b:x;}

//// ---------- 3D LUT CACHE ----------
// Each film look is a Hald-CLUT PNG (125×125 = 25³ nodes) baked in Lightroom.
// Load it once into a Float32 cube; renderRecipe samples it trilinearly.
const LUT_N=25;
const LUTS={};
let lutRepaintScheduled=false;
function onLutReady(){
  if(lutRepaintScheduled)return;lutRepaintScheduled=true;
  requestAnimationFrame(()=>{lutRepaintScheduled=false;
    if($('#editor').classList.contains('open')){paint();if(edMode==='presets'&&!toolK)paintPresetRail();}
  });
}
function loadLUT(file){
  if(LUTS[file])return LUTS[file];
  const o={ready:false,data:null,n:LUT_N,img:new Image()};
  LUTS[file]=o;
  o.img.onload=()=>{
    // 125×125 = one pixel per node; larger (e.g. 1000×1000, 8×8 blocks per node, the
    // round-trip format for web tools that recompress) is read at each block's centre.
    const N=LUT_N, side=125, W=o.img.naturalWidth||side, bs=Math.max(1,Math.round(W/side));
    const S=side*bs, c=document.createElement('canvas');c.width=S;c.height=S;
    const cx=c.getContext('2d',{willReadFrequently:true});cx.drawImage(o.img,0,0,S,S);
    const bd=cx.getImageData(0,0,S,S).data, q=bs>>1, d=new Uint8ClampedArray(side*side*4);
    for(let y=0;y<side;y++)for(let x=0;x<side;x++){
      const si=((y*bs+q)*S+x*bs+q)*4, di=(y*side+x)*4;d[di]=bd[si];d[di+1]=bd[si+1];d[di+2]=bd[si+2];}
    const data=new Float32Array(N*N*N*3);
    for(let i=0;i<N*N*N;i++){
      const r=i%N, g=((i/N)|0)%N, b=(i/(N*N))|0;
      const px=i%side, py=(i/side)|0, off=(py*side+px)*4;
      const ci=(b*N*N+g*N+r)*3;
      data[ci]=d[off]/255; data[ci+1]=d[off+1]/255; data[ci+2]=d[off+2]/255;
    }
    o.data=data;o.ready=true;onLutReady();
  };
  o.img.onerror=()=>{};
  o.img.src=file;
  return o;
}

//// ====================================================================
//// FILM ENGINE — real per-pixel reinterpretation of each Fuji recipe.
//// Pipeline / pixel: White Balance -> simulation colour matrix -> saturation
//// (+ Colour Chrome) -> split-tone -> contrast -> highlight/shadow tone
//// -> matte lift -> mono+toning -> grain -> vignette.
//// Same engine drives the cards, the editor preview and the export.
//// ====================================================================

// Per-simulation colour science (artistic approximations of each film sim).
// mx = 3x3 channel matrix; sat/con base; lift = matte black raise;
// split = split-tone strength with sh (shadow) / hi (highlight) colour vectors.
const I3=[1,0,0, 0,1,0, 0,0,1];

// ---------------------------------------------------------------------------
// PRESET LIBRARY — original film-inspired looks (LUTs), each with character.
// Fields: temp(warmth -100..100) tint(+magenta/-green) sat con mx(3x3)
//   split + splitS(shadow rgb) splitH(highlight rgb)  lift(matte)  grain  vig
//   mono + filt(mono weights) + tone(mono toning rgb).  cat = badge family.
// Inspired by documented stocks (warm portrait/consumer negatives, vivid
// slides, motion-picture stocks, lomo/cross-process, faded vintage, B&W).
// ---------------------------------------------------------------------------
// LUT-based film looks — real 3D LUTs baked from the Analog Vision Studio V2
// "Frontier" Lightroom profiles (one PNG Hald per stock, applied trilinearly).
// The LUT carries the whole colour; universal sliders layer on top.
const PRESETS=[

 {name:'Kodacolor 100', film:'Négatif grain fin · Frontier', cat:'Négatif', lut:'luts/kodacolor100.png'},
 {name:'UltraMax 400',  film:'Négatif polyvalent · Frontier',cat:'Négatif', lut:'luts/ultramax400.png'},
 // — Diapositive —

 {name:'Polaroid Type 100 Sepia', film:'Instantané sépia · Dehancer', cat:'Instant', mono:1, lut:'luts/polaroid-type100-sepia.png'},

PRESETS.forEach(p=>{p.mono=!!p.mono;});
// neutral user adjustments (cards render presets at their default look)
const NEUTRAL={};

// Merge a preset (P) with live user adjustments (A) into per-pixel constants.
// k = preset intensity (0..1): scales the PRESET toward neutral, while the
// universal user adjustments always apply at full strength.
function buildOps(P,A){
  A=A||NEUTRAL;
  const k=(A.intensity==null?100:A.intensity)/100;
  const L=P.lut?LUTS[P.lut]:null, lutReady=!!(L&&L.ready);   // the film look is a 3D LUT
  const warm=((P.temp||0)*k+(A.temperature||0))/100;
  const grn =((P.tint||0)*k+(A.tint||0))/100;
  const rG=1+0.22*warm, bG=1-0.22*warm, gG=1-0.10*grn;
  const exp=Math.pow(2,(A.exposure||0)/100*0.85);           // perceptual stops (was harsh linear ×0.45–1.55)
  const bri=(A.brightness||0)/100*0.25;                     // additive lift, distinct from exposure's multiplicative stops
  const pSat=P.mono?1:lerp(1,(P.sat==null?1:P.sat),k);      // mono keeps colour for the blend
  const sat=Math.max(0,pSat*(1+(A.saturation||0)/100));
  // user contrast is ADDITIVE over the preset's baked contrast (not multiplicative) + clamped,
  // so a punchy LUT and a slider push can't compound into a blown-out image.
  const con=clamp(lerp(1,(P.con==null?1:P.con),k)+(A.contrast||0)/100*0.5,0.4,2.0);
  const hi=(A.highlights||0)/100*4;
  const sh=(A.shadows||0)/100*4;
  const lift=clamp((P.lift||0)*k+(A.fade||0)/100*0.45,0,0.7);
  const grain=clamp((P.grain||0)*k+(A.grain||0)/100*2,0,3);
  const vig=clamp((P.vig||0)*k+(A.vignette||0)/100*0.55,0,0.85);
  const hal=clamp((P.hal||0)*k+(A.halation||0)/100,0,1.5);
  const bloom=clamp((P.bloom||0)*k+(A.bloom||0)/100*0.8,0,1.2);
  const gSize=(A.grainSize==null?40:A.grainSize)/100;
  const baseMx=P.mx||I3, mx=baseMx===I3?I3:baseMx.map((v,i)=>lerp(I3[i],v,k));
  return {rG,gG,bG,exp,bri,sat,con,hi,sh,lift,grain,vig,hal,bloom,gSize,
    split:(P.split||0)*k, splitS:P.splitS||[0,0,0], splitH:P.splitH||[0,0,0],
    mx,
    lut:lutReady?L.data:null, lutN:lutReady?L.n:LUT_N, lutK:k,   // LUT applied first, blended by intensity
    mono:(!!P.mono)&&!P.lut, monoK:k, filt:P.filt||[0.30,0.59,0.11], tone:P.tone||null};
}

// Cover-draw an image into a w×h context (object-fit: cover).
function drawCover(ctx,img,w,h){
  const iw=img.naturalWidth||img.videoWidth||img.width||w, ih=img.naturalHeight||img.videoHeight||img.height||h;
  const s=Math.max(w/iw,h/ih), dw=iw*s, dh=ih*s;
  ctx.drawImage(img,(w-dw)/2,(h-dh)/2,dw,dh);
}

// Render a preset (+ live adjustments) onto a canvas at w×h from a source image.
// opts.mirror flips horizontally (selfie); opts.noGrain skips grain (live feed).
function renderRecipe(src,P,A,canvas,w,h,opts){
  canvas.width=w;canvas.height=h;
  const ctx=canvas.getContext('2d',{willReadFrequently:true});
  const ready=src&&(src.naturalWidth||src.videoWidth||src.width);
  if(!ready){ctx.fillStyle='#151515';ctx.fillRect(0,0,w,h);return;}
  if(opts&&opts.crop){const c=opts.crop;
    if(c.rot){                                   // straighten: rotate the source about the crop centre
      const ccx=c.sx+c.sw/2, ccy=c.sy+c.sh/2, scl=w/c.sw;
      ctx.save();ctx.translate(w/2,h/2);ctx.scale(scl,scl);ctx.rotate(c.rot);ctx.drawImage(src,-ccx,-ccy);ctx.restore();
    } else ctx.drawImage(src,c.sx,c.sy,c.sw,c.sh,0,0,w,h);
  }
  else if(opts&&opts.mirror){ctx.save();ctx.translate(w,0);ctx.scale(-1,1);drawCover(ctx,src,w,h);ctx.restore();}
  else drawCover(ctx,src,w,h);
  const id=ctx.getImageData(0,0,w,h),d=id.data;
  const O=buildOps(P,A);
  const mx=O.mx, cx=w/2, cy=h/2, maxd=Math.sqrt(cx*cx+cy*cy);
  const LD=O.lut, LN=O.lutN, LN1=O.lutN-1, LNN=O.lutN*O.lutN, LK=O.lutK;   // LUT locals
  let p=0;
  for(let y=0;y<h;y++){
    for(let x=0;x<w;x++,p+=4){
      let r=d[p]/255, g=d[p+1]/255, b=d[p+2]/255;
      // 0. film LUT (trilinear) — the whole look, blended by intensity
      if(LD){
        let fr=r<0?0:r>1?1:r, fg=g<0?0:g>1?1:g, fb=b<0?0:b>1?1:b;
        fr*=LN1; fg*=LN1; fb*=LN1;
        const r0=fr|0, g0=fg|0, b0=fb|0;
        const r1=r0<LN1?r0+1:r0, g1=g0<LN1?g0+1:g0, b1=b0<LN1?b0+1:b0;
        const dr=fr-r0, dg=fg-g0, db=fb-b0, mr=1-dr, mg=1-dg, mb=1-db;
        const w000=mr*mg*mb, w100=dr*mg*mb, w010=mr*dg*mb, w110=dr*dg*mb,

              o010=(b0*LNN+g1*LN+r0)*3, o110=(b0*LNN+g1*LN+r1)*3,
              o001=(b1*LNN+g0*LN+r0)*3, o101=(b1*LNN+g0*LN+r1)*3,
              o011=(b1*LNN+g1*LN+r0)*3, o111=(b1*LNN+g1*LN+r1)*3;
        const lr=LD[o000]*w000+LD[o100]*w100+LD[o010]*w010+LD[o110]*w110+LD[o001]*w001+LD[o101]*w101+LD[o011]*w011+LD[o111]*w111;
        const lg=LD[o000+1]*w000+LD[o100+1]*w100+LD[o010+1]*w010+LD[o110+1]*w110+LD[o001+1]*w001+LD[o101+1]*w101+LD[o011+1]*w011+LD[o111+1]*w111;
        const lb=LD[o000+2]*w000+LD[o100+2]*w100+LD[o010+2]*w010+LD[o110+2]*w110+LD[o001+2]*w001+LD[o101+2]*w101+LD[o011+2]*w011+LD[o111+2]*w111;
        r+=(lr-r)*LK; g+=(lg-g)*LK; b+=(lb-b)*LK;
      }
      // 1. exposure + white balance
      r*=O.rG*O.exp; g*=O.gG*O.exp; b*=O.bG*O.exp;
      // 1b. brightness (flat additive lift, unlike exposure's multiplicative stops)
      if(O.bri){r+=O.bri; g+=O.bri; b+=O.bri;}
      // 2. film colour matrix
      let nr=r*mx[0]+g*mx[1]+b*mx[2];
      let ng=r*mx[3]+g*mx[4]+b*mx[5];
      let nb=r*mx[6]+g*mx[7]+b*mx[8];
      r=nr;g=ng;b=nb;
      let lum=0.299*r+0.587*g+0.114*b;
      // 3. saturation
      r=lum+(r-lum)*O.sat; g=lum+(g-lum)*O.sat; b=lum+(b-lum)*O.sat;
      // 4. split-tone (shadows / highlights)
      if(O.split){
        const sF=lum<0.5?(0.5-lum)*2:0, hF=lum>0.5?(lum-0.5)*2:0, sp=O.split;
        r+=(O.splitS[0]*sF+O.splitH[0]*hF)*sp; g+=(O.splitS[1]*sF+O.splitH[1]*hF)*sp; b+=(O.splitS[2]*sF+O.splitH[2]*hF)*sp;
      }
      // 5. contrast (pivot 0.5)
      r=(r-0.5)*O.con+0.5; g=(g-0.5)*O.con+0.5; b=(b-0.5)*O.con+0.5;
      // 6. highlight / shadow tone
      lum=0.299*r+0.587*g+0.114*b;
      if(O.hi&&lum>0.45){const f=(lum-0.45)/0.55*O.hi*0.028;r+=f;g+=f;b+=f;}
      if(O.sh&&lum<0.55){const f=(0.55-lum)/0.55*O.sh*0.028;r-=f;g-=f;b-=f;}
      // 7. matte / fade
      if(O.lift){const L=O.lift;r=L+r*(1-L);g=L+g*(1-L);b=L+b*(1-L);}
      // 8. mono + toning (blended toward colour by preset intensity)
      if(O.mono){
        const yv=O.filt[0]*r+O.filt[1]*g+O.filt[2]*b, k=O.monoK;
        let mr,mg,mb;
        if(O.tone){mr=yv+O.tone[0];mg=yv+O.tone[1];mb=yv+O.tone[2];}
        else{mr=mg=mb=yv;}
        r=r+(mr-r)*k; g=g+(mg-g)*k; b=b+(mb-b)*k;
      }
      // 9. vignette
      if(O.vig){const dx=x-cx,dy=y-cy,dd=Math.sqrt(dx*dx+dy*dy)/maxd;
        if(dd>0.55){const vf=1-(dd-0.55)/0.45*O.vig;r*=vf;g*=vf;b*=vf;}}
      d[p]=r<0?0:r>1?255:r*255;
      d[p+1]=g<0?0:g>1?255:g*255;
      d[p+2]=b<0?0:b>1?255:b*255;
    }
  }
  // 10. optical glow (halation + bloom), then 11. film grain — both spatial, so post-pass
  if(O.hal||O.bloom)applyGlow(d,w,h,O);
  if(O.grain&&!(opts&&opts.noGrain))applyGrain(d,w,h,O,!!P.mono);
  ctx.putImageData(id,0,0);
}

// Separable box blur on a small float buffer (clamped edges), in place.
function boxBlur(a,w,h,rad,passes){
  const t=new Float32Array(Math.max(w,h)), n=2*rad+1;
  for(let ps=0;ps<passes;ps++){
    for(let y=0;y<h;y++){const o=y*w;let s=0;
      for(let i=-rad;i<=rad;i++)s+=a[o+(i<0?0:i>=w?w-1:i)];
      for(let x=0;x<w;x++){t[x]=s/n;const xo=x-rad, xi=x+rad+1;s+=a[o+(xi>=w?w-1:xi)]-a[o+(xo<0?0:xo)];}
      for(let x=0;x<w;x++)a[o+x]=t[x];}
    for(let x=0;x<w;x++){let s=0;
      for(let i=-rad;i<=rad;i++)s+=a[(i<0?0:i>=h?h-1:i)*w+x];
      for(let y=0;y<h;y++){t[y]=s/n;const yo=y-rad, yi=y+rad+1;s+=a[(yi>=h?h-1:yi)*w+x]-a[(yo<0?0:yo)*w+x];}
      for(let y=0;y<h;y++)a[y*w+x]=t[y];}
  }
}
// Halation (red-orange glow bleeding round highlights, as light bounces off the film base)
// and bloom (soft white-ish diffusion of the highlights). Computed on a ~128px buffer so
// the glow scales with the frame: preview, thumbnails and export look the same.
function applyGlow(d,w,h,O){
  const s=Math.max(1,Math.max(w,h)/128), sw=Math.ceil(w/s), sh=Math.ceil(h/s), n=sw*sh;
  const H=new Float32Array(n), R=new Float32Array(n), G=new Float32Array(n), B=new Float32Array(n), C=new Float32Array(n);
  for(let y=0,p=0;y<h;y++){const row=((y/s)|0)*sw;
    for(let x=0;x<w;x++,p+=4){
      const r=d[p]/255,g=d[p+1]/255,b=d[p+2]/255, l=0.299*r+0.587*g+0.114*b, i=row+((x/s)|0);
      let t=l>0.6?(l-0.6)/0.4:0;t*=t;
      H[i]+=t;R[i]+=t*r;G[i]+=t*g;B[i]+=t*b;C[i]++;}}
  for(let i=0;i<n;i++){const c=C[i]||1;H[i]/=c;R[i]/=c;G[i]/=c;B[i]/=c;}
  if(O.hal)boxBlur(H,sw,sh,2,3);
  if(O.bloom){boxBlur(R,sw,sh,5,3);boxBlur(G,sw,sh,5,3);boxBlur(B,sw,sh,5,3);}
  const hk=O.hal*1.6, bk=O.bloom;
  for(let y=0,p=0;y<h;y++){
    let fy=(y+0.5)/s-0.5;fy=fy<0?0:fy>sh-1?sh-1:fy;const y0=fy|0,y1=y0<sh-1?y0+1:y0,dy=fy-y0;
    for(let x=0;x<w;x++,p+=4){
      let fx=(x+0.5)/s-0.5;fx=fx<0?0:fx>sw-1?sw-1:fx;const x0=fx|0,x1=x0<sw-1?x0+1:x0,dx=fx-x0;
      const i00=y0*sw+x0,i10=y0*sw+x1,i01=y1*sw+x0,i11=y1*sw+x1,
            w00=(1-dx)*(1-dy),w10=dx*(1-dy),w01=(1-dx)*dy,w11=dx*dy;
      let ar=0,ag=0,ab=0;
      if(hk){const hv=(H[i00]*w00+H[i10]*w10+H[i01]*w01+H[i11]*w11)*hk;ar+=hv;ag+=hv*0.3;ab+=hv*0.08;}
      if(bk){ar+=(R[i00]*w00+R[i10]*w10+R[i01]*w01+R[i11]*w11)*bk;
             ag+=(G[i00]*w00+G[i10]*w10+G[i01]*w01+G[i11]*w11)*bk;
             ab+=(B[i00]*w00+B[i10]*w10+B[i01]*w01+B[i11]*w11)*bk;}
      // screen blend: glows lift darks around highlights without clipping them further
      const r=d[p]/255,g=d[p+1]/255,b=d[p+2]/255;
      ar=ar>1?1:ar;ag=ag>1?1:ag;ab=ab>1?1:ab;
      d[p]=(1-(1-r)*(1-ar))*255;d[p+1]=(1-(1-g)*(1-ag))*255;d[p+2]=(1-(1-b)*(1-ab))*255;
    }
  }
}
// Film grain: seeded value noise (stable between repaints), cell size relative to the frame,
// strongest in the midtones like real silver grain, with a touch of chroma on colour stocks.
function ghash(x,y,s){let h=Math.imul(x,374761393)+Math.imul(y,668265263)+Math.imul(s,1442695041)|0;
  h=Math.imul(h^(h>>>13),1274126177);h^=h>>>16;return (h&0xffff)/65535-0.5;}
function vnoise(fx,fy,s){const x0=Math.floor(fx),y0=Math.floor(fy),dx=fx-x0,dy=fy-y0;
  const a=ghash(x0,y0,s),b=ghash(x0+1,y0,s),c=ghash(x0,y0+1,s),e=ghash(x0+1,y0+1,s);
  return (a+(b-a)*dx)*(1-dy)+(c+(e-c)*dx)*dy;}
function applyGrain(d,w,h,O,mono){
  const cells=2600-1900*O.gSize, cell=Math.max(1,Math.max(w,h)/cells), inv=1/cell;
  const amp=O.grain*0.075*(1+0.6*O.gSize), cAmp=mono?0:0.35;
  for(let y=0,p=0;y<h;y++){const fy=y*inv;
    for(let x=0;x<w;x++,p+=4){const fx=x*inv;
      const r=d[p]/255,g=d[p+1]/255,b=d[p+2]/255, l=0.299*r+0.587*g+0.114*b;
      const k=amp*(0.3+2.8*l*(1-l)), n=vnoise(fx,fy,1)*k;
      let nr=n,ng=n,nb=n;
      if(cAmp){nr+=vnoise(fx,fy,2)*k*cAmp;nb+=vnoise(fx,fy,3)*k*cAmp;}
      d[p]=(r+nr)*255;d[p+1]=(g+ng)*255;d[p+2]=(b+nb)*255;
    }
  }
}

let RECIPES=[], RAIL=[];

//// ---------- PERSISTENCE (IndexedDB: each photo's original blob + edit state) ----------
let _db=null;
function idbOpen(){return new Promise((res,rej)=>{
  if(_db)return res(_db);
  const r=indexedDB.open('fotn',2);
  r.onupgradeneeded=()=>{const db=r.result;
    if(!db.objectStoreNames.contains('photos'))db.createObjectStore('photos',{keyPath:'id'});
    if(!db.objectStoreNames.contains('meta'))db.createObjectStore('meta');};   // out-of-line keys (FS handle, prefs)
  r.onsuccess=()=>{_db=r.result;res(_db);};
  r.onerror=()=>rej(r.error);
});}
function idbPut(item){return idbOpen().then(db=>new Promise((res,rej)=>{
  const t=db.transaction('photos','readwrite');t.objectStore('photos').put(item);
  t.oncomplete=()=>res();t.onerror=()=>rej(t.error);}));}
function idbDelete(id){return idbOpen().then(db=>new Promise((res,rej)=>{
  const t=db.transaction('photos','readwrite');t.objectStore('photos').delete(id);
  t.oncomplete=()=>res();t.onerror=()=>rej(t.error);}));}
function idbGetAll(){return idbOpen().then(db=>new Promise((res,rej)=>{
  const r=db.transaction('photos','readonly').objectStore('photos').getAll();
  r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error);}));}
function idbMetaSet(k,v){return idbOpen().then(db=>new Promise((res,rej)=>{
  const t=db.transaction('meta','readwrite');t.objectStore('meta').put(v,k);
  t.oncomplete=()=>res();t.onerror=()=>rej(t.error);}));}
function idbMetaGet(k){return idbOpen().then(db=>new Promise((res,rej)=>{
  const r=db.transaction('meta','readonly').objectStore('meta').get(k);
  r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);}));}
function idbMetaDel(k){return idbOpen().then(db=>new Promise((res,rej)=>{
  const t=db.transaction('meta','readwrite');t.objectStore('meta').delete(k);
  t.oncomplete=()=>res();t.onerror=()=>rej(t.error);}));}

// ---------- FOTN export folder (File System Access API — Android/desktop Chrome) ----------
let _fotnDir=null;
async function fsVerify(h){                       // ensure readwrite permission (may prompt once/session)
  if(!h||!h.queryPermission)return true;
  const opt={mode:'readwrite'};
  if((await h.queryPermission(opt))==='granted')return true;
  try{return (await h.requestPermission(opt))==='granted';}catch(e){return false;}
}
// Returns the persisted FOTN dir handle (writable), or null. `interactive` allows prompting
// (must be called from a user gesture). On first use: pick a location → create/use a FOTN subfolder.
async function getFotnDir(interactive){
  if(!window.showDirectoryPicker)return null;      // unsupported (e.g. iOS Safari) → caller uses share/zip
  if(_fotnDir&&await fsVerify(_fotnDir))return _fotnDir;
  try{const saved=await idbMetaGet('fotnDir');
    if(saved){if(await fsVerify(saved)){_fotnDir=saved;return saved;} }}catch(e){}
  if(!interactive)return null;
  let parent;
  try{parent=await window.showDirectoryPicker({id:'fotnExport',mode:'readwrite',startIn:'pictures'});}
  catch(e){return null;}                           // user cancelled the picker
  let dir; try{dir=await parent.getDirectoryHandle('FOTN',{create:true});}catch(e){dir=parent;}
  _fotnDir=dir; try{await idbMetaSet('fotnDir',dir);}catch(e){}
  return dir;
}
function forgetFotnDir(){_fotnDir=null;return idbMetaDel('fotnDir').catch(()=>{});}
async function writeToDir(dir,name,blob){
  const fh=await dir.getFileHandle(name,{create:true});
  const w=await fh.createWritable();await w.write(blob);await w.close();
}

const presetGroup=p=>p.cat==='Signature'?0:p.mono?2:1;
PRESETS.sort((a,b)=>(presetGroup(a)-presetGroup(b))||a.name.localeCompare(b.name,'fr',{numeric:true,sensitivity:'base'}));
RECIPES=PRESETS.map((p,i)=>{p._i=i;return p;});
RAIL=[ORIGINAL].concat(RECIPES);                  // editor rail = "Original" + the film looks

function loadLibrary(){
  idbGetAll().then(items=>{library=items.sort(orderCmp);renderLibrary();})
             .catch(()=>{library=[];renderLibrary();});
}
// Manual order (`ord`, set by dragging) wins; anything never reordered falls back to newest-first.
function orderCmp(a,b){
  const ao=(a.ord==null?null:a.ord), bo=(b.ord==null?null:b.ord);
  if(ao!=null&&bo!=null)return ao-bo;
  if(ao!=null)return -1;
  if(bo!=null)return 1;
  return (b.created||0)-(a.created||0);
}

function photoCard(it){
  const c=el('div','pcard');c.tabIndex=0;c.dataset.id=it.id;c.setAttribute('role','button');c.setAttribute('aria-label','Ouvrir la photo');
  const img=el('img');img.alt='';img.loading='lazy';img.draggable=false;
  // ratio comes from the thumbnail's real pixels (matches the bitmap → no stretch); else natural
  if(it.tw&&it.th)img.style.aspectRatio=it.tw+'/'+it.th;
  if(it.thumb)img.src=it.thumb;
  c.appendChild(img);
  // selection checkbox (only visible while a selection is active)
  const chk=el('div','pcheck');chk.innerHTML=svgIcon(CHECK_ICON,18);c.appendChild(chk);
  if(selected.has(it.id))c.classList.add('sel');
  // Press and hold ~500ms → the card lifts. Move it = reorder; release it = multi-select.
  c.addEventListener('pointerdown',e=>{
    if(e.button&&e.button!==0)return;
    // a drag that ends over another card lets its click bubble to the gallery, so the flag can
    // survive unread — clear it as each new gesture starts, never leave a tap swallowed
    lpSuppress=false;
    if(selectMode)return;                       // while selecting, a tap just toggles the card
    lpX=e.clientX;lpY=e.clientY;lpIt=it;lpCard=c;lpDown=true;lpMouse=(e.pointerType==='mouse');
    clearTimeout(lpTimer);
    lpTimer=setTimeout(()=>{if(lpDown&&!selectMode)liftCard(it,c,lpX,lpY);},500);
  });
  // moving before the hold completes = the user is scrolling (touch) → drop the timer
  c.addEventListener('pointermove',e=>{
    if(dragLift)return;
    if(Math.abs(e.clientX-lpX)>10||Math.abs(e.clientY-lpY)>10)clearTimeout(lpTimer);
  });
  c.addEventListener('pointerup',()=>clearTimeout(lpTimer));
  c.addEventListener('pointercancel',()=>clearTimeout(lpTimer));
  c.addEventListener('contextmenu',e=>e.preventDefault());
  c.addEventListener('dragstart',e=>e.preventDefault());   // no native image drag
  c.onclick=e=>{
    if(lpSuppress){lpSuppress=false;e.preventDefault();return;}   // ignore the release-click after a hold
    if(selectMode){e.preventDefault();toggleSel(it,c);return;}     // in select mode → toggle
    openItem(it);
  };
  c.onkeydown=e=>{
    if(e.key==='Enter'||e.key===' '){e.preventDefault();if(selectMode)toggleSel(it,c);else openItem(it);return;}
    // keyboard reordering: Ctrl/Cmd + ← / → moves the focused photo one slot in the sequence
    if((e.ctrlKey||e.metaKey)&&(e.key==='ArrowLeft'||e.key==='ArrowRight')&&!selectMode){
      e.preventDefault();moveCard(it,e.key==='ArrowRight'?1:-1);
    }
  };
  return c;
}

// ---- drag to reorder (the gallery order IS the feed sequence, so it is persisted) ----
let dragIt=null, dragEl=null, dragGhost=null, dragLift=false, dragMoved=false,
    dragDX=0, dragDY=0, dragX=0, dragY=0, asRaf=0, asV=0;

function liftCard(it,card,x,y){
  const r=card.getBoundingClientRect();
  dragIt=it;dragEl=card;dragLift=true;dragMoved=false;dragDX=x-r.left;dragDY=y-r.top;
  const g=el('div','pghost');
  g.style.width=r.width+'px';g.style.height=r.height+'px';
  const im=el('img');im.alt='';if(it.thumb)im.src=it.thumb;g.appendChild(im);
  document.body.appendChild(g);dragGhost=g;moveGhost(x,y);
  card.classList.add('ghosted');
  document.body.classList.add('reordering');
  try{navigator.vibrate&&navigator.vibrate(8);}catch(e){}   // "you picked it up"
}
function moveGhost(x,y){
  if(dragGhost)dragGhost.style.transform=`translate(${x-dragDX}px,${y-dragDY}px) scale(1.04)`;
}
// Drop target = the card under the finger; above its middle → before, below → after.
// Moving the node live means the masonry reflows as you drag: what you see is the real result.
function dragOver(x,y){
  const under=document.elementFromPoint(x,y);          // the ghost is pointer-events:none
  const card=under&&under.closest?under.closest('.pcard'):null;
  if(!card||card===dragEl)return;
  const r=card.getBoundingClientRect();
  if(y>r.top+r.height/2)card.after(dragEl);else card.before(dragEl);
}
function endDrag(commit){
  if(dragGhost){dragGhost.remove();dragGhost=null;}
  if(dragEl)dragEl.classList.remove('ghosted');
  document.body.classList.remove('reordering');
  stopAutoScroll();
  const moved=dragMoved;
  dragIt=null;dragEl=null;dragLift=false;dragMoved=false;
  if(!moved)return;
  if(commit)commitOrder();else renderLibrary();        // cancelled mid-drag → back to the stored order
}
function commitOrder(){
  const ids=[...document.querySelectorAll('.pcard')].map(c=>c.dataset.id);
  const by=new Map(library.map(x=>[x.id,x]));
  const next=ids.map(id=>by.get(id)).filter(Boolean);
  if(next.length!==library.length){renderLibrary();return;}   // safety: never drop a photo
  library=next;persistOrder();
}
function persistOrder(){
  library.forEach((it,i)=>{if(it.ord!==i){it.ord=i;idbPut(it).catch(()=>{});}});
}
function moveCard(it,dir){
  const i=library.findIndex(x=>x.id===it.id);if(i<0)return;
  const j=i+dir;if(j<0||j>=library.length)return;
  library.splice(j,0,library.splice(i,1)[0]);
  persistOrder();renderLibrary();
  const c=document.querySelector('.pcard[data-id="'+it.id+'"]');if(c)c.focus();
  toast(`Position ${j+1} sur ${library.length}`);
}
// autoscroll when the finger reaches the top/bottom edge while dragging
function autoScroll(y){
  const edge=90,h=window.innerHeight;
  asV = y<edge ? -(edge-y)/edge*16 : y>h-edge ? (y-(h-edge))/edge*16 : 0;
  if(asV&&!asRaf)asRaf=requestAnimationFrame(asStep);
}
function asStep(){
  asRaf=0;if(!dragLift||!asV)return;
  window.scrollBy(0,asV);dragOver(dragX,dragY);
  asRaf=requestAnimationFrame(asStep);
}
function stopAutoScroll(){asV=0;if(asRaf)cancelAnimationFrame(asRaf);asRaf=0;}

document.addEventListener('pointermove',e=>{
  if(!dragLift){
    // a mouse cannot pan the page, so it starts dragging as soon as it passes the threshold
    if(!lpDown||!lpMouse||selectMode||!lpCard)return;
    if(Math.abs(e.clientX-lpX)<=10&&Math.abs(e.clientY-lpY)<=10)return;
    clearTimeout(lpTimer);liftCard(lpIt,lpCard,lpX,lpY);
  }
  dragX=e.clientX;dragY=e.clientY;
  if(!dragMoved&&(Math.abs(dragX-lpX)>8||Math.abs(dragY-lpY)>8))dragMoved=true;
  moveGhost(dragX,dragY);
  if(dragMoved){dragOver(dragX,dragY);autoScroll(dragY);}
});
document.addEventListener('pointerup',()=>{
  lpDown=false;clearTimeout(lpTimer);
  if(!dragLift)return;
  const it=dragIt, moved=dragMoved;
  endDrag(true);
  lpSuppress=true;                                   // swallow the click that follows the release
  if(!moved&&it&&!selectMode)enterSelect(it.id);      // held without moving → selection, as before
});
document.addEventListener('pointercancel',()=>{lpDown=false;clearTimeout(lpTimer);if(dragLift)endDrag(false);});
// keep the page still under the finger while a card is being dragged
document.addEventListener('touchmove',e=>{if(dragLift)e.preventDefault();},{passive:false});

async function pasteLook(){
  if(!lookClip||!selected.size)return;
  const ids=[...selected];
  const P=lookClip.presetName?(RECIPES.find(p=>p.name===lookClip.presetName)||ORIGINAL):ORIGINAL;
  const ov=showBusy('Application…');
  try{
    let n=0;
    for(let i=0;i<ids.length;i++){
      ov.set(`Application ${i+1}/${ids.length}…`);await nextFrame();
      const it=library.find(x=>x.id===ids[i]);if(!it)continue;
      let r;try{r=await blobToImage(it.blob);}catch(e){continue;}
      try{
        it.edit=it.edit||{};
        it.edit.presetName=lookClip.presetName;
        it.edit.vals=Object.assign(neutralAdj(),lookClip.vals);
        const A=it.edit.vals, g=it.edit.crop||null;
        const mxs=await mxSourceFor(it.edit,r.img);   // keep this photo's own layers in its thumbnail
        let base=mxs.src; if(g&&g.o)base=orientImage(base,g.o);
        let src=base,IW=base.naturalWidth||base.width||3,IH=base.naturalHeight||base.height||2;
        if(g&&(g.kv||g.kh)){const wI=warpKeystone(base,g.kv,g.kh,720);src=wI;IW=wI.width;IH=wI.height;}
        const reg=g?cropRegion(g,IW,IH):{sx:0,sy:0,sw:IW,sh:IH};
        let w=reg.sw,h=reg.sh,m=Math.max(w,h),cap=480;if(m>cap){const s=cap/m;w*=s;h*=s;}
        const cv=document.createElement('canvas');
        renderRecipe(src,P,A,cv,Math.max(1,Math.round(w)),Math.max(1,Math.round(h)),{crop:reg});
        try{it.thumb=cv.toDataURL('image/jpeg',0.82);it.tw=cv.width;it.th=cv.height;}catch(e){}
        mxs.urls.forEach(u=>URL.revokeObjectURL(u));
        try{await idbPut(it);n++;}catch(e){}
      }finally{if(r&&r.url)URL.revokeObjectURL(r.url);}
    }
    exitSelect();renderLibrary();
    toast(n>1?`Réglages appliqués à ${n} photos`:'Réglages appliqués');
  }catch(e){toast('Collage impossible');}
  finally{hideBusy(ov);}
}
function nextFrame(){return new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));}
// render one library item (its saved look + adjustments + crop) to a JPEG blob, headless
async function renderItemToBlob(it,maxE,nonce){
  let r;try{r=await blobToImage(it.blob);}catch(e){return null;}
  try{
    const ed=it.edit||{};
    const P=ed.presetName?(RECIPES.find(p=>p.name===ed.presetName)||ORIGINAL):ORIGINAL;
    const A=Object.assign(neutralAdj(),ed.vals||{});
    const g=ed.crop||null;
    const mxs=await mxSourceFor(ed,r.img);          // surimpression is part of the source
    let base=mxs.src; if(g&&g.o)base=orientImage(base,g.o);
    let src=base,IW=base.naturalWidth||base.width||3,IH=base.naturalHeight||base.height||2;
    if(g&&(g.kv||g.kh)){const wI=warpKeystone(base,g.kv,g.kh,3600);src=wI;IW=wI.width;IH=wI.height;}
    const reg=g?cropRegion(g,IW,IH):{sx:0,sy:0,sw:IW,sh:IH};
    let w=reg.sw,h=reg.sh;const M=maxE||3200,m=Math.max(w,h);if(m>M){const s=M/m;w*=s;h*=s;}
    w=Math.round(w);h=Math.round(h);
    const cv=document.createElement('canvas');
    renderRecipe(src,P,A,cv,w,h,{crop:reg});
    const blob=await new Promise(res=>cv.toBlob(b=>res(b),'image/jpeg',0.94));
    mxs.urls.forEach(u=>URL.revokeObjectURL(u));

function downloadBlob(blob,name){
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;
  document.body.appendChild(a);a.click();a.remove();

// compact timestamp for the zip filename
function stampCompact(){const d=new Date();const p=n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;}
// — minimal ZIP writer (STORE, no compression — JPEGs are already compressed) —
const CRC_TABLE=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;
  for(let k=0;k<8;k++)c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1);t[n]=c>>>0;}return t;})();
function crc32(bytes){let c=~0;for(let i=0;i<bytes.length;i++)c=CRC_TABLE[(c^bytes[i])&0xff]^(c>>>8);return (~c)>>>0;}
async function makeZip(entries){                 // entries: [{name, blob}]
  const enc=new TextEncoder();
  const u16=v=>[v&255,(v>>8)&255], u32=v=>[v&255,(v>>8)&255,(v>>16)&255,(v>>>24)&255];
  const parts=[], central=[]; let offset=0;
  for(const e of entries){

    parts.push(local,nb,data);
    central.push(new Uint8Array([].concat(u32(0x02014b50),u16(20),u16(20),u16(0),u16(0),u16(0),u16(0),
      u32(crc),u32(data.length),u32(data.length),u16(nb.length),u16(0),u16(0),u16(0),u16(0),u32(0),u32(offset))),nb);
    offset+=local.length+nb.length+data.length;
  }
  let cdSize=0;central.forEach(p=>cdSize+=p.length);
  const end=new Uint8Array([].concat(u32(0x06054b50),u16(0),u16(0),
    u16(entries.length),u16(entries.length),u32(cdSize),u32(offset),u16(0)));
  return new Blob([...parts,...central,end],{type:'application/zip'});
}
async function exportBatch(items){
  // Acquire the FOTN folder FIRST (the picker/permission prompt needs the tap's activation, before any render).
  const fsa=!!window.showDirectoryPicker;
  let dir=null;
  if(fsa){dir=await getFotnDir(true);if(!dir){toast('Export annulé');return;}}
  const ov=showBusy('Préparation…');
  try{
    const rendered=[]; let failed=0;
    for(let i=0;i<items.length;i++){
      ov.set(`Rendu ${i+1}/${items.length}…`);await nextFrame();
      const r=await renderItemToBlob(items[i],3200,1000+i);
      if(r&&r.blob)rendered.push(r); else failed++;
    }
    if(!rendered.length){toast('Export impossible');return;}
    // A) Android/desktop Chrome → write each JPEG straight into the FOTN folder.
    if(dir){
      let wrote=0;
      for(let i=0;i<rendered.length;i++){ov.set(`Enregistrement ${i+1}/${rendered.length}…`);
        try{await writeToDir(dir,rendered[i].name,rendered[i].blob);wrote++;}catch(e){failed++;}}
      exitSelect();
      toast((wrote>1?`${wrote} photos`:'Photo')+' → dossier FOTN'+(failed?` (${failed} échec)`:''));
      return;
    }
    // B) iOS (no folder API): single photo → share/download the JPEG…
    if(rendered.length===1){
      const f=new File([rendered[0].blob],rendered[0].name,{type:'image/jpeg'});
      if(navigator.canShare&&navigator.canShare({files:[f]})){
        try{await navigator.share({files:[f],title:'FOTN'});exitSelect();return;}
        catch(e){if(e&&e.name==='AbortError')return;}
      }
      downloadBlob(rendered[0].blob,f.name);exitSelect();toast('Photo exportée');return;
    }
    // …multiple photos → ONE zip whose contents live in a FOTN/ folder (unzips to a FOTN folder).
    ov.set('Compression…');await nextFrame();
    const entries=rendered.map(r=>({name:'FOTN/'+r.name, blob:r.blob}));
    const zip=await makeZip(entries), zname='FOTN_'+stampCompact()+'.zip';
    const zfile=new File([zip],zname,{type:'application/zip'});
    const done=()=>{exitSelect();toast(entries.length+' photos → dossier FOTN'+(failed?` (${failed} échec)`:''));};
    if(navigator.canShare&&navigator.canShare({files:[zfile]})){
      try{await navigator.share({files:[zfile],title:'FOTN'});done();return;}
      catch(e){if(e&&e.name==='AbortError')return;}
    }
    downloadBlob(zip,zname);done();
  }catch(e){toast('Export impossible');}
  finally{hideBusy(ov);}
}
function showBusy(msg){
  const sc=el('div','busyov'),b=el('div','busybox'),sp=el('div','busyspin'),t=el('div','busytxt');
  t.textContent=msg||'';b.appendChild(sp);b.appendChild(t);sc.appendChild(b);document.body.appendChild(sc);
  requestAnimationFrame(()=>sc.classList.add('show'));
  return {el:sc,set(m){t.textContent=m;}};
}
function hideBusy(ov){if(ov&&ov.el){ov.el.classList.remove('show');setTimeout(()=>ov.el.remove(),200);}}

// — load a photo Image from its stored blob —
function blobToImage(blob){return new Promise((res,rej)=>{
  const u=URL.createObjectURL(blob);const im=new Image();
  im.onload=()=>res({img:im,url:u});im.onerror=e=>{URL.revokeObjectURL(u);rej(e);};im.src=u;
});}
function setUserImg(img,url){if(userURL)URL.revokeObjectURL(userURL);userBase=img;userImg=img;userURL=url||null;mxN=null;}

// — open a library photo for editing (restores its saved look + adjustments) —
async function openItem(it){
  let r; try{r=await blobToImage(it.blob);}catch(e){toast('Photo illisible');return;}
  currentItem=it;
  setUserImg(r.img,r.url);
  const ed=it.edit||{};
  cur = ed.presetName ? (RECIPES.find(p=>p.name===ed.presetName)||ORIGINAL) : ORIGINAL;
  vals = Object.assign(neutralAdj(), ed.vals||{});
  cropN = ed.crop ? {...ed.crop} : null;
  await mxApply(ed.mx||null);
  openEditorUI();
}
function openEditorUI(){
  edMode='presets';toolK=null;
  $('#edName').textContent=(cur&&cur.name)||'';
  renderDock();paint();
  document.body.style.overflow='hidden';
  // a11y: remember focus origin, neutralise background, move focus into the dialog
  lastFocused=document.activeElement;
  bgInert(true);
  $('#scrim').classList.add('show');$('#editor').classList.add('open');
  $('#edClose').focus();
  setTimeout(()=>{if(!$('#editor').contains(document.activeElement))$('#edClose').focus();},60);
}
let lastFocused=null;
function bgInert(on){['.app','.fabs'].forEach(s=>{const n=document.querySelector(s);if(n){if(on)n.setAttribute('inert','');else n.removeAttribute('inert');}});}

// — persist the current edit (look + adjustments + crop) back to the library —
function gatherEdit(){return {presetName:(cur&&cur._i>=0)?cur.name:'', vals:{...vals}, crop:cropN?{...cropN}:null,
  mx:mxN?{ids:[...mxN.ids],mode:mxN.mode,opacity:mxN.opacity}:null};}
function makeThumb(){
  if(!userImg)return null;
  const gs=geoSource(cropN,720), src=gs.src, IW=gs.IW, IH=gs.IH;
  const reg=cropN?cropRegion(cropN,IW,IH):{sx:0,sy:0,sw:IW,sh:IH};
  let w=reg.sw,h=reg.sh,m=Math.max(w,h),cap=480;if(m>cap){const s=cap/m;w*=s;h*=s;}
  const cv=document.createElement('canvas');
  renderRecipe(src,cur,vals,cv,Math.max(1,Math.round(w)),Math.max(1,Math.round(h)),{crop:reg});
  try{return {data:cv.toDataURL('image/jpeg',0.82), w:cv.width, h:cv.height};}catch(e){return null;}
}
function saveItem(silent){
  if(!currentItem)return Promise.resolve();
  currentItem.edit=gatherEdit();
  const t=makeThumb();if(t){currentItem.thumb=t.data;currentItem.tw=t.w;currentItem.th=t.h;}
  const ix=library.findIndex(x=>x.id===currentItem.id);if(ix>=0)library[ix]=currentItem;
  return idbPut(currentItem).then(()=>{renderLibrary();if(!silent)toast('Modifications enregistrées');})
                            .catch(()=>{if(!silent)toast('Échec de l’enregistrement');});
}
async function deleteCurrent(){
  if(!currentItem)return;
  if(!await appConfirm('Supprimer cette photo ?'))return;
  const id=currentItem.id;
  idbDelete(id).then(()=>{library=library.filter(x=>x.id!==id);renderLibrary();teardownEditor();toast('Photo supprimée');});
}
function teardownEditor(){
  if(cropMode)exitCrop();
  $('#scrim').classList.remove('show');$('#editor').classList.remove('open');
  document.body.style.overflow='';
  bgInert(false);
  if(lastFocused&&lastFocused.focus){lastFocused.focus();}lastFocused=null;
  currentItem=null;cur=null;mxN=null;userBase=null;
}
function closeEditor(){if(currentItem)saveItem(true);teardownEditor();}   // closing auto-saves
$('#edClose').onclick=closeEditor;$('#scrim').onclick=closeEditor;
$('#btnSave').onclick=()=>{if(cropMode)applyCrop();saveItem(false);teardownEditor();};   // in crop mode: validate the crop too, then save → gallery
$('#btnDelete').onclick=deleteCurrent;

function buildPresetRail(rail){
  const frag=document.createDocumentFragment();
  RAIL.forEach(p=>{
    const b=el('button','pchip');b.dataset.i=p._i;
    b.setAttribute('role','option');b.setAttribute('aria-label',p.name||'');
    const cv=el('canvas');cv.width=112;cv.height=112;cv.setAttribute('aria-hidden','true');
    const sp=el('span');sp.textContent=p.name||'';
    b.appendChild(cv);b.appendChild(sp);

  });

  if(stripScheduled)return;stripScheduled=true;
  requestAnimationFrame(()=>{stripScheduled=false;
    const src=userImg||baseImg;
    if(!src||!(src.naturalWidth||src.width))return;
    document.querySelectorAll('#edRail .pchip canvas').forEach(cv=>{
      const p=presetByI(+cv.parentNode.dataset.i);if(p)renderRecipe(src,p,NEUTRAL,cv,112,112);

  document.querySelectorAll('#edRail .pchip').forEach(c=>{

function buildToolSlider(rail){

  range.innerHTML=`<div class="track"></div><div class="midmark"></div><div class="fill" id="toolFill"></div>
    <input type="range" min="${a.min}" max="${a.max}" step="${a.step}" id="toolInput" aria-label="${a.label}">`;
  rail.appendChild(val);rail.appendChild(range);

  updToolSlider();

  const onCommit=()=>{vals[toolK]=parseFloat(inp.value);updToolSlider();paintLook(false);};  // full on release
  inp.addEventListener('input',onInput);    // keyboard (arrows) still works

// VSCO-style RELATIVE dragging: touching anywhere keeps the current value; only the finger's
// horizontal movement changes it (delta), so there's no jump-to-touch on the first contact.
function attachRelativeSlider(inp,onInput,onCommit){
  const mn=parseFloat(inp.min), mx=parseFloat(inp.max), st=parseFloat(inp.step)||1;
  inp.style.touchAction='none';
  let dragging=false, startX=0, startVal=0;
  inp.addEventListener('pointerdown',e=>{
    dragging=true; startX=e.clientX; startVal=parseFloat(inp.value)||0;
    try{inp.setPointerCapture(e.pointerId);}catch(_){}
    try{inp.focus({preventScroll:true});}catch(_){}
    e.preventDefault();
  });
  inp.addEventListener('pointermove',e=>{
    if(!dragging)return; e.preventDefault();
    const rect=inp.getBoundingClientRect(); if(rect.width<=0)return;
    const per=(mx-mn)/rect.width;                 // full track width spans the whole range
    let v=startVal+(e.clientX-startX)*per;
    v=Math.round(v/st)*st;
    v=v<mn?mn:v>mx?mx:v;
    if(v!==parseFloat(inp.value)){inp.value=v; onInput();}
  });
  const end=e=>{if(!dragging)return; dragging=false; try{inp.releasePointerCapture(e.pointerId);}catch(_){} onCommit();};
  inp.addEventListener('pointerup',end);
  inp.addEventListener('pointercancel',end);
}
function updToolSlider(){
  const a=SLIDER_BY_K[toolK], v=vals[toolK], f=$('#toolFill'), inp=$('#toolInput');
  const txt=fmtAdj(a,v);
  $('#toolVal').textContent=txt; if(inp)inp.setAttribute('aria-valuetext',txt);
  const pct=(v-a.min)/(a.max-a.min)*100, mid=(0-a.min)/(a.max-a.min)*100;
  if(v>=0){f.style.left=mid+'%';f.style.width=(pct-mid)+'%';f.style.background='var(--pos)';}
  else{f.style.left=pct+'%';f.style.width=(mid-pct)+'%';f.style.background='var(--neg)';}
  f.parentNode.querySelector('.midmark').style.left=mid+'%';
}
