//// ---------- EDITOR PREVIEW (canvas, full film engine) ----------
const pvCanvas=$('#pvCanvas');
function paint(){paintPreview();$('#btnExport').hidden=!userImg;}
let pvScheduled=false, pvFull=false;
// draft=true → fast low-res render (while dragging a slider); default/false → full quality.
// The full-quality request always wins so the frame that lands after release is sharp.
function paintPreview(draft){
  if(!cur)return;
  if(!draft)pvFull=true;
  if(pvScheduled)return;pvScheduled=true;
  requestAnimationFrame(()=>{pvScheduled=false;
    const full=pvFull; pvFull=false;
    // crop mode: WYSIWYG result when a transform is set (rot/perspective), else full image (box overlays);
    // outside crop mode: the applied crop+transform.
    const geo = cropMode ? cropDraft : cropN;
    let src, IW, IH, reg;
    if(cropMode && !geoActive(geo)){           // framing only → full (oriented) image with the box overlay
      const gs=geoSource({o:geo&&geo.o},1500); src=gs.src; IW=gs.IW; IH=gs.IH;
      reg={sx:0,sy:0,sw:IW,sh:IH};
    } else if(geo){                            // straighten / perspective / applied crop → WYSIWYG
      const gs=geoSource(geo,1500); src=gs.src; IW=gs.IW; IH=gs.IH; reg=cropRegion(geo,IW,IH);
    } else {                                   // no edit
      src=userImg||baseImg; IW=src.naturalWidth||src.width||3; IH=src.naturalHeight||src.height||2;
      reg={sx:0,sy:0,sw:IW,sh:IH};
    }
    let w=reg.sw, h=reg.sh, m=Math.max(w,h), cap=full?1100:640;   // low-res while scrubbing → smooth
    if(m>cap){const s=cap/m;w*=s;h*=s;}
    renderRecipe(src, cur, vals, pvCanvas, Math.round(w), Math.round(h), {crop:reg});});
}
// slider handlers call paintLook(); keep the name, route to the canvas render.
const paintLook=paintPreview;

// Largest centred crop of aspect `ar` (=w/h) inside an iw×ih image → normalised {x,y,w,h}.
function centeredCrop(iw,ih,ar){
  let w,h;
  if(iw/ih>=ar){h=1;w=(ar*ih)/iw;}   // image wider than target → full height, trim width
  else{w=1;h=(iw/ar)/ih;}            // image taller → full width, trim height
  return {x:(1-w)/2,y:(1-h)/2,w,h,rot:0,kv:0,kh:0};
}
// Render the untouched photo into a small thumbnail (optionally cropped) for the library grid.
function thumbFromImage(img,crop){
  const IW=img.naturalWidth||img.width||3, IH=img.naturalHeight||img.height||2;
  const reg=crop?cropRegion(crop,IW,IH):{sx:0,sy:0,sw:IW,sh:IH};
  let w=reg.sw,h=reg.sh,m=Math.max(w,h),cap=560;if(m>cap){const s=cap/m;w*=s;h*=s;}
  const cv=document.createElement('canvas');
  renderRecipe(img,ORIGINAL,NEUTRAL,cv,Math.max(1,Math.round(w)),Math.max(1,Math.round(h)),{crop:reg});
  try{return {data:cv.toDataURL('image/jpeg',0.82), w:cv.width, h:cv.height};}catch(e){return null;}
}
// Add one or many photos (camera or library) → store each, then open the editor
// only when a single photo was added (multi-import just populates the library).
async function addPhotos(files, openIfSingle, fromCamera, initVals){
  const list=[...files].filter(Boolean);if(!list.length)return;
  const added=[];
  for(let i=0;i<list.length;i++){
    let r; try{r=await blobToImage(list[i]);}catch(e){continue;}
    const iw=r.img.naturalWidth||r.img.width, ih=r.img.naturalHeight||r.img.height;
    // Camera captures get a default 2:3-family crop IN THE CAPTURE ORIENTATION (non-destructive):
    // portrait shot → 2:3 portrait, landscape shot → 3:2 landscape. Original blob kept, editable later.
    const crop=fromCamera?centeredCrop(iw,ih, iw>=ih?3/2:2/3):null;
    const tb=thumbFromImage(r.img,crop);
    const item={id:uid(), created:Date.now()+i, blob:list[i], w:iw, h:ih,
      tw:tb?tb.w:iw, th:tb?tb.h:ih,
      edit:{presetName:'',vals:Object.assign(neutralAdj(),initVals||{}),crop:crop}, thumb:tb?tb.data:null};
    // once a manual order exists, a new photo still lands first (ahead of the lowest `ord`)
    let min=null;library.forEach(x=>{if(x.ord!=null&&(min==null||x.ord<min))min=x.ord;});
    if(min!=null)item.ord=min-1;
    library.unshift(item);
    try{await idbPut(item);}catch(e){}
    added.push({item,r,crop});
  }
  if(!added.length){toast('Import impossible');return;}
  renderLibrary();
  if(added.length===1 && openIfSingle){
    const {item,r,crop}=added[0];
    currentItem=item;setUserImg(r.img,r.url);cur=ORIGINAL;vals=Object.assign(neutralAdj(),initVals||{});cropN=crop?{...crop}:null;
    openEditorUI();
  }else{
    added.forEach(x=>{if(x.r&&x.r.url)URL.revokeObjectURL(x.r.url);});
    toast(added.length+(added.length>1?' photos importées':' photo importée'));
  }
}
// reset value so re-picking the same file still fires "change"
$('#upload').addEventListener('change',e=>{addPhotos(e.target.files,true,false);e.target.value='';});          // import → no default crop
$('#camInput').addEventListener('change',e=>{addPhotos(e.target.files,true,true);e.target.value='';});        // camera → default 2:3 crop

//// ---------- IN-APP CAMERA (tap-to-focus + lock, brightness preview before shooting) ----------
// Falls back to the native system camera (#camInput) whenever getUserMedia — or a capability
// it needs — isn't available, so the shutter never dead-ends on an unsupported browser.
let camStream=null, camTrack=null, camCaps=null, camFocusLocked=false, camBrightVal=0, camFacing='environment';
const camSupported=()=>!!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia);
// default capture format: 2:3 (portrait) — matches the app's mobile-only, portrait-held use.
// The viewfinder masks down to this frame live, and the shutter crops the sensor to match,
// so what's on screen while shooting IS what gets saved (no surprise post-hoc crop).
const CAM_AR=2/3;
function updateCamMask(){
  const video=$('#camVideo'), bw=video.clientWidth, bh=video.clientHeight;
  if(!bw||!bh)return;
  const bar=bw/bh<CAM_AR?Math.max(0,(bh-bw/CAM_AR)/2):0;   // portrait screens only: letterbox top/bottom
  $('#camMaskTop').style.height=bar+'px';
  $('#camMaskBot').style.height=bar+'px';
}
async function startCamStream(){
  camStream=await navigator.mediaDevices.getUserMedia({
    video:{facingMode:{ideal:camFacing},width:{ideal:1920},height:{ideal:1920}},audio:false});
  $('#camVideo').srcObject=camStream;
  $('#camVideo').classList.toggle('mirror',camFacing==='user');   // selfie preview reads naturally, mirrored
  camTrack=camStream.getVideoTracks()[0];
  camCaps=(camTrack.getCapabilities&&camTrack.getCapabilities())||{};
  // manual focus lock needs the track to support switching focusMode itself — most mobile
  // browsers (notably iOS Safari) don't expose it at all, so the button degrades to disabled.
  const lockable=Array.isArray(camCaps.focusMode)&&camCaps.focusMode.includes('manual');
  const lockBtn=$('#camLock');
  lockBtn.setAttribute('aria-disabled',lockable?'false':'true');
  lockBtn.title=lockable?'Verrouiller la mise au point':'Verrouillage non pris en charge sur cet appareil';
}
async function openCamera(){
  if(!camSupported()){$('#camInput').click();return;}
  const ov=$('#camOv');
  ov.hidden=false; requestAnimationFrame(()=>{ov.classList.add('show');updateCamMask();});
  camFacing='environment'; camFocusLocked=false; camBrightVal=0;
  $('#camBrightRange').value=0; $('#camVideo').style.filter='';
  updateCamLockUI();
  try{await startCamStream();}catch(e){closeCamera();toast('Caméra indisponible');return;}
}
async function toggleCamFacing(){
  if(!camStream)return;
  const prev=camFacing;
  camFacing=camFacing==='environment'?'user':'environment';
  camStream.getTracks().forEach(t=>t.stop());
  camFocusLocked=false; updateCamLockUI();
  try{await startCamStream();}
  catch(e){camFacing=prev;try{await startCamStream();}catch(e2){closeCamera();toast('Caméra indisponible');}}
}
function closeCamera(){
  const ov=$('#camOv');
  ov.classList.remove('show');
  setTimeout(()=>{ov.hidden=true;},200);
  if(camStream){camStream.getTracks().forEach(t=>t.stop());camStream=null;}
  camTrack=null;camCaps=null;camFocusLocked=false;
  $('#camFocus').classList.remove('show','locked');
}
async function camTapFocus(ev){
  if(!camTrack||camFocusLocked)return;
  const video=$('#camVideo'), r=video.getBoundingClientRect();
  const cx=ev.clientX, cy=ev.clientY;
  const nx=clamp((cx-r.left)/r.width,0,1), ny=clamp((cy-r.top)/r.height,0,1);
  const fo=$('#camFocus');
  fo.style.left=(cx-r.left)+'px'; fo.style.top=(cy-r.top)+'px';
  fo.classList.remove('show');void fo.offsetWidth;fo.classList.add('show');
  if(camCaps&&Array.isArray(camCaps.focusMode)&&camCaps.focusMode.length){
    try{await camTrack.applyConstraints({advanced:[{pointsOfInterest:[{x:nx,y:ny}]}]});}catch(e){}
  }
}
async function toggleCamLock(){
  if(!camTrack||!camCaps)return;
  if(!Array.isArray(camCaps.focusMode)||!camCaps.focusMode.includes('manual')){
    toast('Verrouillage non pris en charge sur cet appareil');return;
  }
  try{
    await camTrack.applyConstraints({advanced:[{focusMode:camFocusLocked?'continuous':'manual'}]});
    camFocusLocked=!camFocusLocked;
    updateCamLockUI();
    toast(camFocusLocked?'Mise au point verrouillée':'Mise au point automatique');
  }catch(e){toast('Verrouillage impossible');}
}
function updateCamLockUI(){
  const b=$('#camLock');
  b.classList.toggle('on',camFocusLocked);
  b.setAttribute('aria-pressed',camFocusLocked?'true':'false');
  $('#camFocus').classList.toggle('locked',camFocusLocked);
}
function camBrightInput(e){
  camBrightVal=+e.target.value;
  // preview only — the value travels with the photo as its initial (still editable) brightness,
  // the raw frame is captured untouched so nothing is baked/clipped into the saved JPEG
  $('#camVideo').style.filter=camBrightVal?`brightness(${(1+camBrightVal/100*0.5).toFixed(3)})`:'';
}
function capturePhoto(){
  if(!camTrack)return;
  const video=$('#camVideo'), c=$('#camCanvas');
  const vw=video.videoWidth||1280, vh=video.videoHeight||720;
  // crop the raw sensor frame to the 2:3 guide shown live in the mask — WYSIWYG capture
  let sx=0,sy=0,sw=vw,sh=vh;
  if(vw/vh>CAM_AR){sw=vh*CAM_AR;sx=(vw-sw)/2;} else {sh=vw/CAM_AR;sy=(vh-sh)/2;}
  c.width=Math.round(sw);c.height=Math.round(sh);
  const ctx=c.getContext('2d');
  if(camFacing==='user'){ctx.translate(c.width,0);ctx.scale(-1,1);}   // save selfies mirrored, matching the preview
  ctx.drawImage(video,sx,sy,sw,sh,0,0,c.width,c.height);
  const bv=camBrightVal;
  c.toBlob(blob=>{
    if(!blob){toast('Capture impossible');return;}
    const file=new File([blob],'camera-'+Date.now()+'.jpg',{type:'image/jpeg'});
    closeCamera();
    addPhotos([file],true,true,bv?{brightness:bv}:null);
  },'image/jpeg',0.92);
}
$('#camClose').onclick=closeCamera;
$('#camSwitch').onclick=toggleCamFacing;
$('#camLock').onclick=toggleCamLock;
$('#camShutter').onclick=capturePhoto;
$('#camBrightRange').addEventListener('input',camBrightInput);
$('#camVideo').addEventListener('click',camTapFocus);
document.addEventListener('visibilitychange',()=>{if(document.hidden&&camStream)closeCamera();});
window.addEventListener('resize',()=>{if(!$('#camOv').hidden)updateCamMask();});

//// ---------- SURIMPRESSION (double / triple exposition) ----------
// An EDIT SETTING, not a capture mode: 1 or 2 library photos are stacked onto the photo being
// edited. It stays non-destructive — `edit.mx` holds {ids, mode, opacity} and the blend happens
// on the SOURCE image, so presets, adjustments, crop, thumbnails and export all follow for free
// (renderRecipe accepts any drawable source, canvas included).
const MX_MODES=[{k:'screen',n:'Écran'},{k:'lighten',n:'Éclaircir'},{k:'multiply',n:'Multiplier'},{k:'source-over',n:'Fondu'}];
const MX_MAX=2;
const MX_ICON='M11.99 18.54l-7.37-5.73L3 14.07l9 7 9-7-1.63-1.27-7.38 5.74zM12 16l7.36-5.73L21 9l-9-7-9 7 1.63 1.27L12 16z';

// editor state: what is applied, and the draft being edited in the overlay
let mxN=null;                    // {ids,mode,opacity} applied to the open photo, or null
let mxDraft=null, mxDraftImgs=new Map(), mxBusy=false;

function mxDefaults(){return {ids:[],mode:'screen',opacity:60};}
function mxClean(mx){
  if(!mx||!mx.ids||!mx.ids.length)return null;
  const ids=mx.ids.filter(id=>library.some(x=>x.id===id)).slice(0,MX_MAX);
  return ids.length?{ids,mode:mx.mode||'screen',opacity:(mx.opacity==null?60:mx.opacity)}:null;
}
// cover-fit a layer onto the base frame: different ratios still fill it
function mxDrawCover(x,img,W,H){
  const iw=img.naturalWidth||img.width||1, ih=img.naturalHeight||img.height||1;
  const s=Math.max(W/iw,H/ih), w=iw*s, h=ih*s;
  x.drawImage(img,(W-w)/2,(H-h)/2,w,h);
}
// Blend `layers` onto `base` and return a canvas the render pipeline can use as its source.
function mxBlend(base,layers,mode,opacity,maxEdge){
  let W=base.naturalWidth||base.width||1, H=base.naturalHeight||base.height||1;
  if(maxEdge){const m=Math.max(W,H);if(m>maxEdge){const s=maxEdge/m;W=Math.max(1,Math.round(W*s));H=Math.max(1,Math.round(H*s));}}
  const cv=document.createElement('canvas');cv.width=W;cv.height=H;
  const x=cv.getContext('2d');
  x.drawImage(base,0,0,W,H);
  const a=Math.max(0,Math.min(1,(opacity==null?60:opacity)/100));
  layers.forEach(im=>{
    if(!im)return;
    x.globalCompositeOperation=mode||'screen';
    x.globalAlpha=a;
    mxDrawCover(x,im,W,H);
  });
  x.globalCompositeOperation='source-over';x.globalAlpha=1;
  return cv;
}
// Build the blended source for a stored edit. Caller must revoke the returned urls.
async function mxSourceFor(edit,img){
  const mx=mxClean(edit&&edit.mx);
  if(!mx)return {src:img,urls:[]};
  const layers=[],urls=[];
  for(const id of mx.ids){
    const it=library.find(x=>x.id===id);
    if(!it||!it.blob)continue;                       // layer photo deleted since → simply skipped
    try{const r=await blobToImage(it.blob);layers.push(r.img);urls.push(r.url);}catch(e){}
  }
  if(!layers.length)return {src:img,urls:[]};
  return {src:mxBlend(img,layers,mx.mode,mx.opacity),urls};
}

// ---- editor wiring ----
// Recompose what the editor renders from. userBase stays the untouched photo so the layers can
// be changed or removed at any time; userImg is what every existing render path already reads.
async function mxApply(mx){
  mxN=mxClean(mx);
  if(!userBase){userImg=userBase;return;}
  if(!mxN){userImg=userBase;return;}
  const {src,urls}=await mxSourceFor({mx:mxN},userBase);
  userImg=src;urls.forEach(u=>URL.revokeObjectURL(u));
}
function mxLabel(n){return n?(n>1?n+' calques':'1 calque'):'Aucun calque';}

async function mxOpen(){
  if(!currentItem||!userBase)return;
  const others=library.filter(x=>x.id!==currentItem.id);
  mxDraft=mxN?{ids:[...mxN.ids],mode:mxN.mode,opacity:mxN.opacity}:mxDefaults();
  mxDraftImgs=new Map();
  $('#mxov').hidden=false;bgInert(true);
  requestAnimationFrame(()=>$('#mxov').classList.add('show'));
  $('#mxOpacity').value=mxDraft.opacity;
  mxRenderPicks(others);mxRenderModes();
  await mxPreload();mxRefresh();
  $('#mxOk').focus();
}
function mxClose(){
  $('#mxov').classList.remove('show');
  setTimeout(()=>{$('#mxov').hidden=true;},200);
  mxDraft=null;mxDraftImgs=new Map();
  bgInert(true);                                     // the editor stays open behind the overlay
}
// keep the picked layers decoded so mode/opacity changes repaint instantly
async function mxPreload(){
  if(!mxDraft)return;
  for(const id of mxDraft.ids){
    if(mxDraftImgs.has(id))continue;
    const it=library.find(x=>x.id===id);if(!it||!it.blob)continue;
    try{const r=await blobToImage(it.blob);mxDraftImgs.set(id,r);}catch(e){}
  }
}
function mxReleaseDraft(){mxDraftImgs.forEach(r=>{if(r&&r.url)URL.revokeObjectURL(r.url);});mxDraftImgs=new Map();}
function mxRenderPicks(others){
  const box=$('#mxPicks');box.innerHTML='';
  const old=$('#mxov').querySelector('.mxempty');if(old)old.remove();
  if(!others.length){
    const e=el('div','mxempty');
    e.textContent='Importe d’autres photos pour pouvoir en superposer.';
    box.after(e);box.hidden=true;return;
  }
  box.hidden=false;
  others.forEach(it=>{
    const i=mxDraft.ids.indexOf(it.id), on=i>=0;
    const b=el('button','mxpick'+(on?' on':''));b.type='button';
    b.setAttribute('aria-pressed',on?'true':'false');
    b.setAttribute('aria-label','Superposer cette photo');
    if(!on&&mxDraft.ids.length>=MX_MAX)b.setAttribute('aria-disabled','true');
    const im=el('img');im.alt='';if(it.thumb)im.src=it.thumb;b.appendChild(im);
    const o=el('span','mxord');o.textContent=on?String(i+1):'';b.appendChild(o);
    b.onclick=async()=>{
      const at=mxDraft.ids.indexOf(it.id);
      if(at>=0)mxDraft.ids.splice(at,1);
      else{if(mxDraft.ids.length>=MX_MAX)return;mxDraft.ids.push(it.id);}
      mxRenderPicks(others);mxRenderModes();await mxPreload();mxRefresh();
    };
    box.appendChild(b);
  });
}
function mxRenderModes(){
  const box=$('#mxModes');box.innerHTML='';
  const none=!mxDraft||!mxDraft.ids.length;
  box.hidden=none;$('#mxOpRow').hidden=none;        // nothing stacked → nothing to tune
  if(none)return;
  MX_MODES.forEach(m=>{
    const b=el('button','chip'+(m.k===mxDraft.mode?' on':''));
    b.type='button';b.textContent=m.n;
    b.setAttribute('aria-pressed',m.k===mxDraft.mode?'true':'false');
    b.onclick=()=>{mxDraft.mode=m.k;mxRenderModes();mxRefresh();};
    box.appendChild(b);
  });
}
// live preview: blend small, then run the photo's own look over it so what you see is the result
function mxRefresh(){
  if(!mxDraft||!userBase)return;
  $('#mxTitle').textContent=mxLabel(mxDraft.ids.length);
  $('#mxOpVal').textContent=mxDraft.opacity;
  const layers=mxDraft.ids.map(id=>mxDraftImgs.get(id)).filter(Boolean).map(r=>r.img);
  const src=layers.length?mxBlend(userBase,layers,mxDraft.mode,mxDraft.opacity,900):userBase;
  const IW=src.naturalWidth||src.width||3, IH=src.naturalHeight||src.height||2;
  const reg=cropN?cropRegion(cropN,IW,IH):{sx:0,sy:0,sw:IW,sh:IH};
  let w=reg.sw,h=reg.sh,m=Math.max(w,h);if(m>760){const s=760/m;w*=s;h*=s;}
  renderRecipe(src,cur,vals,$('#mxPrev'),Math.max(1,Math.round(w)),Math.max(1,Math.round(h)),{crop:reg});

function warpKeystone(img, kvv, khh, cap){

}
// Source for a geometry: applies the keystone warp if any, returns {src,IW,IH}.
// Rotate an image by q quarter-turns (clockwise) → canvas. Cached per image+q (full-res, done once).
function orientImage(img,q){

// Auto-level: magnitude²-weighted mean tilt of near-axis edges → straighten angle.
function autoDeskew(img){

  let w=360,h=Math.round(360*IH/IW); if(IH>IW){h=360;w=Math.round(360*IW/IH);}

// turn a normalised crop {x,y,w,h,rot(deg)} into a source-px region {sx,sy,sw,sh,rot(rad)};
// when rotated, auto-zoom + clamp so the tilted crop always stays inside the image (no empty corners)
function cropRegion(cn,IW,IH){

function resizeCropCorner(corner,s,dnx,dny){

  .replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,40)||'recette';}
function uniqueName(pname,nonce){
  const d=new Date();const p=n=>String(n).padStart(2,'0');
  const stamp=`${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
  const rnd=(nonce!=null?nonce:Math.floor(1000+ (Date.now()%9000)));
  const nm=(pname!==undefined?pname:(cur&&cur.name));
  return `fotn_${slugify(nm)}_${stamp}-${rnd}.jpg`;
}
async function exportImage(){

function appConfirm(message,okLabel){
  return new Promise(res=>{
    const sc=el('div','cscrim'), box=el('div','cbox');
    const p=el('p','cmsg');p.textContent=message;
    const row=el('div','crow');
    const cancel=el('button','cbtn');cancel.textContent='Annuler';
    const ok=el('button','cbtn danger');ok.textContent=okLabel||'Supprimer';
    row.appendChild(cancel);row.appendChild(ok);box.appendChild(p);box.appendChild(row);sc.appendChild(box);
    document.body.appendChild(sc);requestAnimationFrame(()=>sc.classList.add('show'));
    function close(v){sc.classList.remove('show');document.removeEventListener('keydown',onKey);setTimeout(()=>sc.remove(),200);res(v);}
    function onKey(e){if(e.key==='Escape')close(false);}
    cancel.onclick=()=>close(false);ok.onclick=()=>close(true);
    sc.onclick=e=>{if(e.target===sc)close(false);};
    document.addEventListener('keydown',onKey);
    ok.focus();
  });
}

// close on Esc (crop overlay first, then the editor)
document.addEventListener('keydown',e=>{if(e.key!=='Escape')return;if(!$('#mxov').hidden)$('#mxCancel').click();else if(toolK)cancelTool();else if(cropMode)cancelCrop();else if(cur)closeEditor();else if(selectMode)exitSelect();});

// while selecting: Ctrl/Cmd+A = tout sélectionner (again = tout désélectionner), Suppr = supprimer la sélection
document.addEventListener('keydown',e=>{
  if(!selectMode||cur)return;
  const t=e.target;if(t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.isContentEditable))return;
  if((e.ctrlKey||e.metaKey)&&(e.key==='a'||e.key==='A')){
    e.preventDefault();
    if(library.length&&selected.size===library.length)deselectAll();else selectAll();
  }else if((e.key==='Delete'||e.key==='Backspace')&&selected.size){
    e.preventDefault();deleteSelected();
  }
});

//// ---------- PWA: offline + instant loads via service worker ----------
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});});
}
